<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Language Learning in 3 Months</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky bar, one reading column on a notebook-grid hero; lessons are plain rows, each month has its own colour. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#0F172A; --muted:#566178; --line:#DCE1EC; --soft:#E8ECF6; --grid:#E1E6F1;
  --m1:#2342C9; --m2:#9A5B00; --m3:#C0182F; --gold:#F2B705; --good:#17794F; --bad:#C4332B; --on:#FFFFFF; --good-bg:#E3F4EB; --bad-bg:#FBE7E5;
  --mc:var(--m1);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2E; --ink:#E8ECF5; --muted:#9AA5BC; --line:#27314A; --soft:#1E2740; --grid:#18203A;
  --m1:#8FA3FF; --m2:#F0A93A; --m3:#FF7D8E; --gold:#F2B705; --good:#4CC38A; --bad:#FF7B72; --on:#0E1320; --good-bg:#12302A; --bad-bg:#3A1D22; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2E; --ink:#E8ECF5; --muted:#9AA5BC; --line:#27314A; --soft:#1E2740; --grid:#18203A;
  --m1:#8FA3FF; --m2:#F0A93A; --m3:#FF7D8E; --gold:#F2B705; --good:#4CC38A; --bad:#FF7B72; --on:#0E1320; --good-bg:#12302A; --bad-bg:#3A1D22; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mc);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--gold);color:#0F172A;font-weight:800;font-size:1.2rem}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;font-weight:600;color:var(--muted);border-radius:0}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--m1)}
.tab:hover{color:var(--ink)}
.langflags{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.langflag{display:grid;place-items:center;width:38px;height:34px;padding:0;border:1.5px solid transparent;border-radius:999px;background:transparent;font-size:1.3rem;line-height:1;cursor:pointer}
.langflag:hover{background:var(--soft)}
.langflag[aria-pressed="true"]{background:var(--soft);border-color:var(--mc);box-shadow:inset 0 0 0 1px var(--mc)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600}

/* hero */
.hero{padding-block:34px 26px;border-bottom:1px solid var(--line);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:clamp(2.2rem,7vw,3.9rem);font-weight:800;margin-bottom:12px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--gold) 62% 92%,transparent 92%)}
.lead{max-width:56ch;color:var(--muted);font-size:1.05rem;margin-bottom:22px}
.stats{display:flex;flex-wrap:wrap;gap:12px 28px;margin-bottom:22px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--mc);border-radius:99px;transition:width .4s}
.bigbar{max-width:520px;margin-bottom:20px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:700}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--mc);border-color:var(--mc);color:var(--on)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:6px 12px;font-size:.88rem;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* home sections */
section.block{padding-block:28px 6px}
h2.sec{font-size:1.5rem;margin-bottom:14px}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rhythm div{padding:12px 14px;border-bottom:1px solid var(--line);min-width:0}
.rhythm b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rhythm span{font-weight:600}
.week{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.day{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.day.on{background:var(--good);color:var(--on);border-color:var(--good)}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.month{margin-top:32px}
.mhead{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;border-top:4px solid var(--mc);padding-top:12px;margin-bottom:6px}
.mhead .tag{font-family:var(--f-display);font-weight:800;font-size:.95rem;color:var(--mc);letter-spacing:.02em;text-transform:uppercase}
.mhead h2{font-size:1.7rem}
.mhead .dates{margin-left:auto;color:var(--muted);font-size:.88rem;font-weight:600}
.mintro{color:var(--muted);margin-bottom:8px;max-width:64ch}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 6px;border-radius:0}
.row:hover{background:var(--soft)}
.num{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.88rem;border:1.5px solid var(--mc);color:var(--mc);font-variant-numeric:tabular-nums}
.row.done .num{background:var(--mc);color:var(--on)}
.row .t{font-weight:700;min-width:0}
.row .s{font-size:.82rem;color:var(--muted);display:block;font-weight:500}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--mc)}
.dots i.on{background:var(--mc)}

/* lesson */
.lesson{padding-block:20px 60px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0;margin-bottom:8px}
.back:hover{color:var(--ink)}
.lesson h1{font-size:clamp(1.9rem,6vw,3rem);font-weight:800;margin-bottom:6px;color:var(--ink)}
.lesson .eyebrow{color:var(--mc)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 18px}
.step{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;text-align:left;min-width:0}
.step small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.step[aria-current="step"]{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc)}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:.82rem;font-variant-numeric:tabular-nums}
.step.done .n{background:var(--mc);color:var(--on)}
.panel{display:flex;flex-direction:column;gap:22px}
.intro{font-size:1.1rem;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:1.15rem;margin-bottom:10px}
.notes{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.notes li{max-width:70ch}
.notes b{color:var(--mc)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tblwrap h3{padding:14px 16px 4px;font-size:1.05rem}
table{border-collapse:collapse;width:100%;min-width:300px}
th,td{text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.es{font-weight:700}
td.pr{color:var(--muted)}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:0 16px}
.vitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.vitem .es{font-weight:700;overflow-wrap:anywhere}
.vitem .en{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.say{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--mc)}
.say:hover{background:var(--soft)}
.phr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.phr:last-child,.vitem:last-child{border-bottom:0}
.phr .es{font-weight:700;font-size:1.05rem}
.phr .en{grid-column:1;color:var(--muted)}
.phr .say{grid-column:2;grid-row:1 / span 2}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:78px 1fr auto;gap:2px 10px;align-items:start}
.line.nowho{grid-template-columns:1fr auto}
.who{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mc);padding-top:3px}
.line .es{font-weight:600}
.line .en{color:var(--muted);font-size:.92rem}
.line .en[hidden]{display:none}
.dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--mc);color:var(--on)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--mc)}
.footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.qmeta{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.q{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.2;margin:18px 0 14px;text-wrap:balance}
.qlabel{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--mc)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.mark2{font-weight:800}
.ok .mark2{color:var(--good)} .no .mark2{color:var(--bad)}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
.inrow input[type=text]{flex:1 1 220px;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.05rem}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--good-bg);border:1.5px solid var(--good)}
.fb.no{background:var(--bad-bg);border:1.5px solid var(--bad)}
.fb small{display:block;font-weight:500;color:var(--muted)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:12px;align-items:center}
.tray.ans{border-style:solid;background:var(--surface)}
.chip{padding:8px 14px;border:2px solid var(--mc);border-radius:10px;background:var(--surface);font-weight:700;color:var(--ink)}
.chip:hover{background:var(--soft)}
.result{text-align:left}
.score{font-family:var(--f-display);font-size:4rem;font-weight:800;line-height:1;color:var(--mc);font-variant-numeric:tabular-nums}
.missed{margin:12px 0 0;padding-left:1.1em}

/* speak */
textarea{width:100%;min-height:150px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);resize:vertical;line-height:1.5}
label.lab{display:block;font-weight:700;margin-bottom:6px}
.hint{color:var(--muted);font-size:.9rem}
.cando{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cando label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600}
.cando input{width:20px;height:20px;margin-top:2px;accent-color:var(--mc)}
.convo{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.convo li{font-weight:600}
.promptbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--soft);font-weight:600}
.banner{padding:18px;border-radius:14px;background:var(--mc);color:var(--on)}
.banner h3{font-size:1.4rem;margin-bottom:6px}
.banner .btn{margin-top:12px;background:var(--on);color:var(--mc);border-color:var(--on)}

/* flashcards + words */
.fc{min-height:240px;display:grid;place-items:center;text-align:center;padding:26px;border:2px solid var(--ink);border-radius:18px;background:var(--surface);cursor:pointer;width:100%;box-shadow:6px 6px 0 var(--mc)}
.fc .big{font-family:var(--f-display);font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;overflow-wrap:anywhere}
.fc .side{display:block;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.fctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
select{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);max-width:100%}
.search{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;font-size:1rem}
.wl h3{margin:20px 0 4px;font-size:1.05rem;color:var(--mc)}
.pad{padding-block:22px 60px}
.pad h1{font-size:clamp(1.8rem,6vw,2.6rem);margin-bottom:8px}


/* practice */
.xpchip{display:inline-flex;gap:5px;align-items:baseline;background:var(--gold);color:#0F172A;border:0;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.xpchip b{font-family:var(--f-display);font-size:1rem}
.lvcard{display:flex;gap:18px;align-items:center;margin-bottom:6px}
.badge{flex:none;width:92px;height:92px;border-radius:24px;background:var(--gold);color:#0F172A;display:grid;place-items:center;align-content:center;font-family:var(--f-display);font-weight:800;font-size:2.8rem;line-height:.95;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.badge small{font-family:var(--f-body);font-size:.62rem;letter-spacing:.14em;font-weight:700}
.lvinfo{min-width:0;flex:1}
.lvinfo h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:10px}
.xpbar{height:16px;max-width:520px}
.xpbar i{background:var(--gold)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);min-width:0}
.topic:hover{border-color:var(--m1)}
.topic:active{transform:translateY(2px);border-bottom-width:3px}
.tic{font-size:2.2rem;line-height:1;margin-bottom:4px}
.tn{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.td{font-size:.84rem;color:var(--muted);line-height:1.35}
.tm{display:flex;justify-content:space-between;gap:8px;width:100%;margin-top:8px;font-size:.78rem;color:var(--muted);font-weight:600}
.stars{color:var(--m2);letter-spacing:.08em}
.road{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lv{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}
.lvn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.lvt{display:flex;flex-direction:column;min-width:0}
.lvt span{font-size:.88rem;color:var(--muted)}
.lvx{font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.lv.done .lvn{background:var(--good);border-color:var(--good);color:var(--on)}
.lv.now .lvn{background:var(--gold);border-color:var(--gold);color:#0F172A}
.lv.now{background:var(--soft)}
.lv.lock{opacity:.7}
.sess{padding-block:16px 130px;max-width:720px}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.sbar .bar{flex:1;height:14px}
.sbar .bar i{background:var(--good)}
.x{background:none;border:0;font-size:1.3rem;color:var(--muted);padding:4px 8px;border-radius:8px}
.x:hover{color:var(--ink)}
.sstreak{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.qprompt{font-size:clamp(1.4rem,4.5vw,1.9rem);margin:6px 0 16px}
.qbig{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.qbig.col{flex-direction:column;align-items:flex-start;gap:6px}
.qw{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.1;overflow-wrap:anywhere}
.qw.sm{font-size:clamp(1.3rem,5vw,1.9rem)}
.qh .emo{font-size:3.2rem;line-height:1}
.emo{line-height:1}
.sw{display:inline-block;width:56px;height:56px;border-radius:50%;border:3px solid var(--line);vertical-align:middle}
.tile .sw{width:64px;height:64px}
.tile .emo{font-size:3.4rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:grid;place-items:center;min-height:120px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface)}
.tile:hover:not(:disabled){border-color:var(--m1)}
.tile.ok{border-color:var(--good);background:var(--good-bg)}
.tile.no{border-color:var(--bad);background:var(--bad-bg)}
.opt{border-bottom-width:4px}
.lbtns{display:flex;gap:10px;align-items:center}
.bigsay{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:16px;border:2px solid var(--m1);border-bottom-width:5px;background:var(--surface);color:var(--m1);font-weight:800;font-size:1.1rem}
.bigsay svg{width:28px;height:28px}

<script>
let LESSONS=[];
const PR=["yo","tú","él / ella / usted","nosotros","vosotros (Spain)","ellos / ellas / ustedes"];
const conj=(h,f,t)=>({h,head:t?["Who","Verb","Means"]:["Who","Verb"],rows:f.map((x,i)=>t?[PR[i],x,t[i]]:[PR[i],x])});
const tr=(v,s)=>["I "+v,"you "+v,"he / she "+(s||v+"s"),"we "+v,"you all "+v,"they "+v];
const L=o=>LESSONS.push(o);

/* ---------------- MONTH 1 ---------------- */
L({m:1,t:"Numbers 1–100+",
intro:"Numbers turn up everywhere: ages, prices, phone numbers, times, scores. Learn 0–30 first, then the tens. After that, the pattern does the work.",
notes:[
"<b>16–29 are one word:</b> dieciséis, diecisiete, veintidós, veintitrés.",
"<b>From 31 up, use y</b> between tens and units: treinta <b>y</b> uno (31), cuarenta <b>y</b> cinco (45), noventa <b>y</b> nueve (99).",
"<b>cien</b> is exactly 100. Anything over it uses <b>ciento</b>: ciento uno (101), ciento veinte (120).",
"Hundreds agree with the noun (doscientas personas) and three are irregular: <b>quinientos</b> 500, <b>setecientos</b> 700, <b>novecientos</b> 900.",
"<b>uno</b> shortens before a masculine noun: un libro, veintiún años."],
vocab:[["cero","0"],["uno","1"],["dos","2"],["tres","3"],["cuatro","4"],["cinco","5"],["seis","6"],["siete","7"],["ocho","8"],["nueve","9"],["diez","10"],["once","11"],["doce","12"],["trece","13"],["catorce","14"],["quince","15"],["dieciséis","16"],["diecisiete","17"],["dieciocho","18"],["diecinueve","19"],["veinte","20"],["veintiuno","21"],["treinta","30"],["cuarenta","40"],["cincuenta","50"],["sesenta","60"],["setenta","70"],["ochenta","80"],["noventa","90"],["cien","100"],["doscientos","200"],["quinientos","500"],["mil","1,000"]],
phrases:[["Tengo quince años.","I am fifteen years old."],["Cuesta veinte euros.","It costs twenty euros."],["Somos cuatro en mi familia.","There are four of us in my family."],["Van dos a uno.","It's two–one."]],
quiz:[["How do you say 45?","cuarenta y cinco","cuarenta y quince","cuatro y cincuenta","cincuenta y cuatro"],["What number is “setenta y tres”?","73","37","83","63"],["How do you say 101?","ciento uno","cien uno","cien y uno","ciento y uno"],["TYPE: Write 12 in Spanish","doce"],["TYPE: Write 58 in Spanish","cincuenta y ocho"],["ORDER: I am fifteen years old","Tengo quince años"]],
speak:["Say your age out loud: “Tengo ___ años.”","Count from 1 to 30 without looking, then 30 to 100 in tens.","Read your phone number digit by digit in Spanish.","Say the score of the last match you watched, like “tres a dos”."]});

L({m:1,t:"Introducing yourself",
intro:"Your first real conversation: greet someone, say who you are, where you're from and how old you are.",
notes:[
"Spanish asks “how are you called?”: <b>¿Cómo te llamas?</b> → <b>Me llamo Sam.</b>",
"Age uses <b>tener</b> (to have), not “to be”: <b>Tengo quince años</b>, literally “I have fifteen years”.",
"<b>Encantado</b> if you're a boy or man, <b>encantada</b> if you're a girl or woman.",
"<b>tú</b> is informal (friends, people your age). <b>usted</b> is formal (adults you don't know): ¿Cómo se llama?",
"Questions open with <b>¿</b> and exclamations with <b>¡</b>. Both are always written."],
vocab:[["hola","hello"],["buenos días","good morning"],["buenas tardes","good afternoon"],["buenas noches","good evening / good night"],["adiós","goodbye"],["hasta luego","see you later"],["hasta mañana","see you tomorrow"],["¿cómo te llamas?","what's your name?"],["me llamo…","my name is…"],["mucho gusto","nice to meet you"],["encantado / encantada","pleased to meet you"],["¿de dónde eres?","where are you from?"],["soy de…","I'm from…"],["vivo en…","I live in…"],["¿cuántos años tienes?","how old are you?"],["tengo… años","I'm … years old"],["¿cómo estás?","how are you?"],["bien, gracias","fine, thanks"],["¿y tú?","and you?"],["por favor","please"],["gracias","thank you"],["de nada","you're welcome"],["perdón","sorry / excuse me"]],
dialogue:{t:"Meeting someone new",lines:[["Ana","¡Hola! Me llamo Ana. ¿Y tú?","Hi! My name is Ana. And you?"],["Sam","Hola, Ana. Me llamo Sam. Mucho gusto.","Hi, Ana. I'm Sam. Nice to meet you."],["Ana","Encantada. ¿De dónde eres?","Pleased to meet you. Where are you from?"],["Sam","Soy de Irlanda. Vivo en Dublín. ¿Y tú?","I'm from Ireland. I live in Dublin. And you?"],["Ana","Soy de Madrid. ¿Cuántos años tienes?","I'm from Madrid. How old are you?"],["Sam","Tengo quince años. ¿Y tú?","I'm fifteen. And you?"]]},
quiz:[["How do you say “My name is Sam”?","Me llamo Sam","Soy llamo Sam","Tengo Sam","Estoy llamo Sam"],["Which question asks someone's age?","¿Cuántos años tienes?","¿Cómo te llamas?","¿De dónde eres?","¿Cómo estás?"],["A girl says “pleased to meet you”:","Encantada","Encantado","Encantade","Encanto"],["TYPE: I live in Dublin","vivo en dublín"],["ORDER: Where are you from?","¿De dónde eres?"]],
speak:["Introduce yourself in four sentences: name, age, where you're from, where you live.","Ask a partner (or the mirror) the same four questions.","Greet someone for morning, afternoon and night."]});

L({m:1,t:"Family and friends",
intro:"Talk about the people closest to you. This lesson also introduces gender (el / la) and plurals, which you'll use in every lesson from here.",
notes:[
"Nouns are masculine (<b>el</b>) or feminine (<b>la</b>). Most nouns ending in -o are masculine and most ending in -a are feminine.",
"Plurals: add <b>-s</b> after a vowel (hermano → hermanos) or <b>-es</b> after a consonant. <b>Los hermanos</b> can mean “brothers” or “brothers and sisters”.",
"Possessives agree with the thing owned, not the owner: <b>mi</b> hermano, <b>mis</b> hermanos. Also tu / tus (your) and su / sus (his, her, their).",
"Counting people: Tengo <b>un</b> hermano y <b>dos</b> hermanas. No tengo hermanos."],
vocab:[["la familia","family"],["el padre / el papá","father / dad"],["la madre / la mamá","mother / mum"],["los padres","parents"],["el hermano","brother"],["la hermana","sister"],["el hijo","son"],["la hija","daughter"],["el abuelo","grandfather"],["la abuela","grandmother"],["el tío","uncle"],["la tía","aunt"],["el primo","cousin (boy)"],["la prima","cousin (girl)"],["el amigo","friend (boy)"],["la amiga","friend (girl)"],["el mejor amigo","best friend"],["mi / mis","my"],["tu / tus","your"],["su / sus","his, her, their"],["el perro","dog"],["el gato","cat"]],
phrases:[["Tengo un hermano y dos hermanas.","I have one brother and two sisters."],["Mi mejor amigo se llama Dani.","My best friend is called Dani."],["Mis abuelos viven en Cork.","My grandparents live in Cork."],["No tengo hermanos.","I don't have any brothers or sisters."],["Mi familia es pequeña.","My family is small."]],
quiz:[["“My sisters” is…","mis hermanas","mi hermanas","mis hermana","mi hermana"],["Which means “grandmother”?","la abuela","la tía","la prima","la madre"],["“Los padres” means…","parents","fathers","grandparents","cousins"],["TYPE: I have two brothers","tengo dos hermanos"],["ORDER: My best friend is called Dani","Mi mejor amigo se llama Dani"]],
speak:["Describe your family out loud: who is in it, their names and ages.","Describe your best friend in three sentences.","Say how many brothers, sisters, cousins and pets you have."]});

L({m:1,t:"School",
intro:"Subjects, classroom objects and opinions about school, all things you can talk about with a Spanish penfriend on day one.",
notes:[
"<b>el / la / los / las</b> = the. <b>un / una / unos / unas</b> = a, some.",
"<b>Me gusta</b> + singular, <b>me gustan</b> + plural: Me gusta la historia. Me gustan las matemáticas.",
"Adjectives agree: la clase es divertida, el examen es difícil.",
"Subjects and languages are not capitalised: el inglés, la historia.",
"Spain says <b>los deberes</b> for homework. Latin America says <b>la tarea</b>."],
vocab:[["el colegio","school"],["el instituto","secondary school (Spain)"],["la clase","class"],["el profesor / la profesora","teacher"],["el alumno / la alumna","student"],["el libro","book"],["el cuaderno","notebook"],["el bolígrafo","pen"],["la mochila","backpack"],["los deberes","homework"],["el examen","exam"],["las matemáticas","maths"],["el inglés","English"],["la historia","history"],["las ciencias","science"],["la educación física","PE"],["el recreo","break time"],["difícil","difficult"],["fácil","easy"],["aburrido","boring"],["divertido","fun"]],
phrases:[["Mi clase favorita es la historia.","My favourite class is history."],["Tengo un examen de matemáticas el lunes.","I have a maths exam on Monday."],["El profesor es muy simpático.","The teacher is very nice."],["Me gusta el recreo porque juego al fútbol.","I like break because I play football."]],
quiz:[["Which is correct?","Me gustan las matemáticas","Me gusta las matemáticas","Me gustan el inglés","Me gusta los libros"],["“El examen es difícil” means…","The exam is difficult","The exam is easy","The class is boring","The book is difficult"],["Which word means “break time”?","el recreo","el colegio","la clase","la mochila"],["TYPE: the teacher (female)","la profesora"],["ORDER: I like history","Me gusta la historia"]],
speak:["Say what subjects you have and which is your favourite.","Give an opinion on three subjects using fácil, difícil, aburrido or divertido.","Say what is in your backpack."]});

L({m:1,t:"Food and drinks",
intro:"Say what you eat, what you like and when you're hungry. Meal times in Spain are late, which is part of the culture.",
notes:[
"Spain: <b>el zumo, las patatas, el plátano</b>. Latin America: el jugo, las papas, la banana.",

vocab:[["el agua","water"],["la leche","milk"],["el zumo","juice"],["el café","coffee"],["el té","tea"],["el pan","bread"],["el queso","cheese"],["el jamón","ham"],["el pollo","chicken"],["el pescado","fish"],["la carne","meat"],["el arroz","rice"],["las patatas","potatoes"],["la ensalada","salad"],["la fruta","fruit"],["la manzana","apple"],["el plátano","banana"],["el helado","ice cream"],["el desayuno","breakfast"],["la comida","lunch"],["la cena","dinner"],["tengo hambre","I'm hungry"],["tengo sed","I'm thirsty"]],

quiz:[["How do you say “I'm thirsty”?","Tengo sed","Estoy sed","Soy sed","Tengo sediento"],["“El desayuno” is…","breakfast","dinner","lunch","a snack"],["Which is a drink?","el zumo","el queso","el arroz","el pollo"],["TYPE: I want a coffee","quiero un café"],["ORDER: I don't like fish","No me gusta el pescado"]],
speak:["Say what you eat for breakfast, lunch and dinner.","Say three foods you love and three you don't like.","Say you're hungry and ask for something to drink."]});

L({m:1,t:"Days, months and time",
intro:"Dates and clock times let you make plans, talk about school and give birthdays.",

L({m:1,t:"Places and directions",

speak:["Give directions from your front door to a shop near you.","Ask where the station, the bank and the stadium are.","Describe where things are in your bedroom using cerca, lejos, al lado de."]});

L({m:1,t:"Key verbs: ser and estar",
intro:"Spanish has two verbs for “to be”. This is the biggest hurdle in beginner Spanish, and the rule is simple once you see it.",
tables:[conj("ser · to be (who/what you are)",["soy","eres","es","somos","sois","son"],["I am","you are","he / she is","we are","you all are","they are"]),conj("estar · to be (how/where you are)",["estoy","estás","está","estamos","estáis","están"],["I am","you are","he / she is","we are","you all are","they are"])],
notes:[
"<b>Ser</b> is for what something <i>is</i>: identity, origin, job, personality, time. Soy Sam. Es de España. Son las tres.",
"<b>Estar</b> is for how or where something is <i>right now</i>: feelings, health, location. Estoy cansado. Madrid está en España.",
"Memory trick: <b>ser = who/what</b>, <b>estar = how/where</b>.",
"Some adjectives change meaning: <b>es aburrido</b> (he is boring) vs <b>está aburrido</b> (he is bored). <b>Es listo</b> (clever) vs <b>está listo</b> (ready)."],
vocab:[["cansado / cansada","tired"],["contento / contenta","happy"],["triste","sad"],["enfadado / enfadada","angry"],["nervioso / nerviosa","nervous"],["ocupado / ocupada","busy"],["enfermo / enferma","ill"],["alto / alta","tall"],["simpático / simpática","nice"],["aquí","here"],["allí","there"],["en casa","at home"]],
phrases:[["Soy de Irlanda.","I'm from Ireland."],["Estoy en casa.","I'm at home."],["Mi padre es profesor.","My dad is a teacher."],["Hoy estoy muy cansado.","Today I'm very tired."],["La clase es divertida.","The class is fun."],["¿Cómo estás? Estoy bien.","How are you? I'm well."]],
quiz:[["“Estoy cansado.” Why estar?","A temporary state","Origin","Job","Time"],["Complete: Ella ___ de España.","es","está","soy","son"],["Complete: Nosotros ___ en el parque.","estamos","somos","están","es"],["Complete: Mi madre ___ profesora.","es","está","soy","están"],["TYPE: I am tired (estar)","estoy cansado|estoy cansada"],["ORDER: The exam is difficult","El examen es difícil"]],
speak:["Say five sentences with ser: who you are, where you're from, what you're like.","Say five sentences with estar: how you feel and where you are now.","Answer “¿Cómo estás hoy?” in three different ways."]});

L({m:1,t:"Key verbs: tener, ir, hacer, querer",
intro:"Four verbs cover a huge share of everyday speech: to have, to go, to do/make and to want.",
tables:[conj("tener · to have",["tengo","tienes","tiene","tenemos","tenéis","tienen"],tr("have","has")),conj("ir · to go",["voy","vas","va","vamos","vais","van"],tr("go","goes")),conj("hacer · to do / make",["hago","haces","hace","hacemos","hacéis","hacen"],tr("do","does")),conj("querer · to want",["quiero","quieres","quiere","queremos","queréis","quieren"],tr("want"))],
notes:[
"<b>tener</b>: age (tengo quince años), hunger, thirst, cold, heat, and <b>tener que + infinitive</b> = have to: Tengo que estudiar.",
"<b>ir a + place</b>: Voy a la playa. (a + el = al: Voy al cine.)",
"<b>hacer</b> makes and does, and describes weather: Hace sol. Hace frío.",
"<b>querer + noun or infinitive</b>: Quiero un helado. Quiero jugar.",
"Tener and querer are “boot” verbs: e → ie in every form except nosotros and vosotros."],
vocab:[["tener que","to have to"],["tener frío","to be cold"],["tener calor","to be hot"],["tener miedo","to be scared"],["hacer los deberes","to do homework"],["hacer deporte","to do sport"],["hace sol","it's sunny"],["hace frío","it's cold"],["hace calor","it's hot"],["ir de compras","to go shopping"],["ir en autobús","to go by bus"],["ir a pie","to go on foot"],["¿qué haces?","what are you doing?"]],
phrases:[["Tengo que hacer los deberes.","I have to do my homework."],["Voy al colegio en autobús.","I go to school by bus."],["Hoy hace mucho frío.","It's very cold today."],["Quiero jugar al fútbol.","I want to play football."],["¿Qué haces esta tarde?","What are you doing this afternoon?"]],
quiz:[["Complete: Voy ___ colegio en autobús.","al","a el","en el","del"],["“Tengo que estudiar” means…","I have to study","I have studied","I want to study","I like studying"],["Complete: Nosotros ___ al cine.","vamos","vais","van","voy"],["Complete: ¿Qué ___ tú?","haces","hago","hace","hacen"],["Complete: Ellos ___ quince años.","tienen","tiene","tenemos","tengo"],["TYPE: I want a pizza","quiero una pizza"],["ORDER: Today it's sunny","Hoy hace sol"]],
speak:["Say what you have to do this week (Tengo que…).","Say where you go every day and how (Voy a… en…).","Say three things you want to do (Quiero…)."]});

L({m:1,t:"Making questions",
intro:"Questions keep a conversation going. Learn the nine question words and you can ask almost anything.",
notes:[
"Questions begin with <b>¿</b> and end with <b>?</b>. Question words always carry an accent: <b>qué, quién, dónde, cuándo, cómo, cuánto, cuál</b>.",
"Yes/no questions need no extra word. Say a statement with a rising voice: ¿Tienes hermanos?",
"<b>¿Por qué?</b> (two words, accent) = why. <b>Porque</b> (one word) = because.",
"<b>¿Cuánto?</b> agrees with the noun: ¿Cuántos años tienes? ¿Cuántas hermanas tienes?",
"<b>¿Qué?</b> asks for a definition (¿Qué es esto?). <b>¿Cuál?</b> picks from a set (¿Cuál es tu número?)."],
vocab:[["¿qué?","what?"],["¿quién?","who?"],["¿dónde?","where?"],["¿adónde?","where to?"],["¿cuándo?","when?"],["¿cómo?","how? / pardon?"],["¿por qué?","why?"],["porque","because"],["¿cuánto? / ¿cuánta?","how much?"],["¿cuántos? / ¿cuántas?","how many?"],["¿cuál?","which? / what?"],["¿con quién?","with whom?"],["¿a qué hora?","at what time?"],["¿verdad?","right? / isn't it?"],["¿en serio?","seriously?"]],
phrases:[["¿Dónde vives?","Where do you live?"],["¿Cuándo es el examen?","When is the exam?"],["¿Por qué te gusta el fútbol?","Why do you like football?"],["¿Con quién vas al cine?","Who are you going to the cinema with?"],["¿A qué hora es el partido?","What time is the match?"]],
quiz:[["Which asks “Why?”","¿Por qué?","¿Porque?","¿Quién?","¿Cuándo?"],["“¿Cuántos años tienes?” asks…","your age","your name","where you live","the time"],["Complete: ¿___ vives? — En Dublín.","Dónde","Cuándo","Quién","Cómo"],["Complete: ¿___ estás? — Estoy bien.","Cómo","Dónde","Qué","Cuándo"],["TYPE: What time is it?","¿qué hora es?"],["ORDER: Why do you like football?","¿Por qué te gusta el fútbol?"]],
speak:["Make up one question for each question word and say it out loud.","Interview a friend (or Claude) with five questions about their life.","Ask three questions about school and answer them yourself."]});

L({m:1,t:"Building your own sentences",
intro:"This is where you stop copying phrases and start inventing your own. The method: begin with a short sentence, then add one piece at a time.",
tables:[{h:"The sentence ladder",head:["Step","Spanish","Means"],rows:[["1","Juego al fútbol.","I play football."],["2","Juego al fútbol con mis amigos.","…with my friends."],["3","Juego al fútbol con mis amigos los sábados.","…on Saturdays."],["4","Juego al fútbol con mis amigos los sábados porque me encanta.","…because I love it."]]}],
notes:[
"<b>Recipe: who + verb + the rest.</b> Soy Sam. Juego al fútbol. Vivo en Dublín.",
"<b>Drop the subject pronoun.</b> The verb ending already says who: <b>Tengo</b> quince años, not “yo tengo”, unless you want to stress it.",
"<b>Negatives:</b> put <b>no</b> before the verb: No tengo hermanos. No me gusta el pescado.",
"<b>Adjectives follow the noun and agree:</b> una casa grande, unos amigos simpáticos.",
"<b>Glue words</b> link ideas: y, pero, o, también, porque."],
vocab:[["y","and"],["pero","but"],["o","or"],["también","also"],["muy","very"],["mucho","a lot"],["un poco","a bit"],["siempre","always"],["a veces","sometimes"],["nunca","never"],["con","with"],["sin","without"],["todos los días","every day"],["los fines de semana","at weekends"]],
phrases:[["Tengo un hermano y una hermana.","I have a brother and a sister."],["Me gusta el fútbol, pero no me gusta el tenis.","I like football, but I don't like tennis."],["A veces juego con mis primos.","Sometimes I play with my cousins."],["Nunca como pescado.","I never eat fish."]],
quiz:[["Where does “no” go?","Before the verb","After the verb","At the end","Before the noun"],["Complete: Tengo un hermano ___ una hermana.","y","pero","o","con"],["Which is right?","una casa grande","una grande casa","un casa grande","una casa grandes"],["TYPE: I always play football","siempre juego al fútbol|juego al fútbol siempre"],["ORDER: I don't have a dog","No tengo perro"],["ORDER: I live in Dublin and I have one brother","Vivo en Dublín y tengo un hermano"]],
speak:["Climb the ladder three times: start with a 3-word sentence and add a piece each time.","Write five sentences about your week using y, pero and porque.","Describe your best friend with at least six sentences."]});

L({m:2,t:"Past tense: regular verbs",
intro:"Now you can talk about what you did. The preterite describes finished actions: I played, I ate, I spoke.",
tables:[conj("hablar · -ar verbs",["hablé","hablaste","habló","hablamos","hablasteis","hablaron"],["I spoke","you spoke","he / she spoke","we spoke","you all spoke","they spoke"]),conj("comer · -er / -ir verbs",["comí","comiste","comió","comimos","comisteis","comieron"],["I ate","you ate","he / she ate","we ate","you all ate","they ate"])],
notes:[
"<b>Endings.</b> -ar verbs: é, aste, ó, amos, asteis, aron. -er and -ir verbs: í, iste, ió, imos, isteis, ieron.",
"<b>Accents matter:</b> hablo = I speak, <b>habló</b> = he spoke.",
"<b>Spelling changes in “yo”:</b> jugar → <b>jugué</b>, buscar → <b>busqué</b>, llegar → <b>llegué</b>, empezar → <b>empecé</b>. This keeps the sound.",
"<b>nosotros</b> forms of -ar and -ir verbs look the same as the present (hablamos). The time word tells you which: ayer hablamos."],
vocab:[["ayer","yesterday"],["anoche","last night"],["la semana pasada","last week"],["el fin de semana pasado","last weekend"],["el año pasado","last year"],["hace dos días","two days ago"],["jugué","I played"],["comí","I ate"],["bebí","I drank"],["hablé","I spoke"],["miré","I looked / watched"],["escribí","I wrote"],["salí","I went out"],["compré","I bought"],["vi","I saw / watched"]],
phrases:[["Ayer jugué al fútbol con mis amigos.","Yesterday I played football with my friends."],["Anoche comí pizza.","Last night I ate pizza."],["Mi hermano compró una camiseta.","My brother bought a shirt."],["Hablamos por teléfono.","We spoke on the phone."],["¿Qué comiste?","What did you eat?"]],
quiz:[["“Comí” means…","I ate","I eat","I will eat","I was eating"],["Complete: Ayer ___ al fútbol. (jugar, yo)","jugué","jugé","juego","jugo"],["Complete: Ella ___ con su madre. (hablar)","habló","hablo","habla","hablaron"],["Complete: Nosotros ___ pizza. (comer)","comimos","comemos","comamos","comieron"],["TYPE: Yesterday I played football","ayer jugué al fútbol|jugué al fútbol ayer"],["ORDER: Last night I ate pizza","Anoche comí pizza"]],
speak:["Say five things you did yesterday using -ar and -er/-ir verbs.","Say what you ate and drank last night.","Ask “¿Qué hiciste?” style questions: ¿Qué comiste? ¿Con quién hablaste?"]});

L({m:2,t:"Past tense: irregular verbs",
intro:"The most useful past verbs are irregular: went, did, had, was. Learn these four tables and your stories get much richer.",
tables:[conj("ir / ser · went / was",["fui","fuiste","fue","fuimos","fuisteis","fueron"],["I went / was","you went / were","he / she went / was","we went / were","you all went / were","they went / were"]),conj("hacer · did / made",["hice","hiciste","hizo","hicimos","hicisteis","hicieron"],["I did","you did","he / she did","we did","you all did","they did"]),conj("tener · had",["tuve","tuviste","tuvo","tuvimos","tuvisteis","tuvieron"],["I had","you had","he / she had","we had","you all had","they had"]),conj("estar · was (somewhere)",["estuve","estuviste","estuvo","estuvimos","estuvisteis","estuvieron"],["I was","you were","he / she was","we were","you all were","they were"])],
notes:[
"<b>Irregular stem + special endings:</b> -e, -iste, -o, -imos, -isteis, -ieron. None of them take accents: tuve, tuvo.",
"<b>ir and ser are identical</b> in the preterite. Context decides: Fui al cine (I went) / Fue un partido genial (It was a great match).",
"<b>hizo</b> is spelled with z (hacer → hice, hizo).",
"More irregulars to meet: poder → pude, querer → quise, decir → dije, venir → vine, ver → vi."],
vocab:[["fui","I went / I was"],["fuimos","we went / we were"],["hice","I did / I made"],["tuve","I had"],["estuve","I was (at a place)"],["pude","I could"],["quise","I wanted"],["dije","I said"],["vine","I came"],["¿qué hiciste?","what did you do?"],["¿adónde fuiste?","where did you go?"],["fue genial","it was great"],["fue horrible","it was awful"]],
phrases:[["Fui a la playa con mi familia.","I went to the beach with my family."],["¿Qué hiciste el sábado?","What did you do on Saturday?"],["Tuve un examen difícil.","I had a hard exam."],["Estuvimos en Madrid una semana.","We were in Madrid for a week."],["Fue un partido increíble.","It was an incredible match."]],
quiz:[["“Fui al parque” means…","I went to the park","I was in the park","I will go","I go"],["Complete: Ayer ___ los deberes. (hacer, yo)","hice","hací","hizo","hago"],["Complete: Mi equipo ___ al estadio. (ir)","fue","va","fui","fueron"],["Complete: Nosotros ___ un examen. (tener)","tuvimos","tenimos","tuvieron","tuvemos"],["TYPE: I had a test","tuve un examen"],["ORDER: What did you do yesterday?","¿Qué hiciste ayer?"]],
speak:["Tell me about last weekend: where you went, what you did, what you had to do.","Describe a holiday or a day trip using fui, estuve, hice.","Ask three people what they did last Saturday."]});

L({m:2,t:"The future",
intro:"Two ways to talk about what will happen. The first is easy and used all the time in speech. The second sounds more formal and is good for promises.",
tables:[conj("ir a + infinitive · going to",["voy a jugar","vas a jugar","va a jugar","vamos a jugar","vais a jugar","van a jugar"],["I'm going to play","you're going to play","he / she is going to play","we're going to play","you all are going to play","they're going to play"]),conj("jugar · simple future",["jugaré","jugarás","jugará","jugaremos","jugaréis","jugarán"],["I will play","you will play","he / she will play","we will play","you all will play","they will play"])],
notes:[
"<b>ir a + infinitive</b> works exactly like “going to”: Voy a jugar. Vamos a comer pizza.",
"<b>Simple future:</b> take the whole infinitive and add <b>é, ás, á, emos, éis, án</b>: comer → comeré, ir → iré, jugar → jugaré.",
"<b>Irregular stems</b> (same endings): tener → tendr-, hacer → har-, poder → podr-, decir → dir-, salir → saldr-, querer → querr-.",
"In everyday talk Spanish speakers prefer <b>ir a</b>. The simple future is for promises, predictions and more formal speech."],
vocab:[["mañana","tomorrow"],["esta noche","tonight"],["este fin de semana","this weekend"],["la semana que viene","next week"],["el año que viene","next year"],["pronto","soon"],["más tarde","later"],["algún día","someday"],["viajar","to travel"],["iré","I will go"],["jugaré","I will play"],["haré","I will do"],["tendré","I will have"],["seré","I will be"]],
phrases:[["Mañana voy a jugar al fútbol.","Tomorrow I'm going to play football."],["La semana que viene vamos a viajar a Madrid.","Next week we're going to travel to Madrid."],["El año que viene tendré dieciséis años.","Next year I'll be sixteen."],["Algún día iré a España.","One day I will go to Spain."]],
quiz:[["“Voy a jugar” means…","I'm going to play","I played","I play","I was playing"],["Complete: Mañana ___ a ver el partido. (nosotros)","vamos","vemos","fuimos","vais"],["“Iré” means…","I will go","I went","I go","I was going"],["Complete: El año que viene ___ más años. (tener, yo)","tendré","tenerá","tendremos","tengo"],["TYPE: Tomorrow I'm going to play football","mañana voy a jugar al fútbol|voy a jugar al fútbol mañana"],["ORDER: Next week we're going to travel","La semana que viene vamos a viajar"]],
speak:["Say five things you're going to do this weekend.","Say three things you will do one day (Algún día…).","Predict the score of the next big match: “Creo que…”"]});

L({m:2,t:"Opinions",
intro:"Saying what you like, don't like and think is how you sound like a person and not a textbook.",
notes:[
"<b>Gustar works backwards.</b> The thing you like is the subject: <b>Me gusta el fútbol</b> = football is pleasing to me. Singular → <b>gusta</b>, plural → <b>gustan</b>: Me gustan los videojuegos.",
"<b>Who likes it?</b> me, te, le, nos, os, les: ¿Te gusta? Le gusta (he / she). Nos gusta. Les gusta.",
"<b>Contrast with A mí / A ti:</b> A mí me gusta el fútbol, pero a ti te gusta el baloncesto.",
"<b>After gusta, use the infinitive:</b> Me gusta jugar. No me gusta madrugar.",
"<b>Give reasons with porque:</b> Creo que es genial porque es muy divertido."],
vocab:[["me gusta","I like (singular)"],["me gustan","I like (plural)"],["no me gusta","I don't like"],["me encanta","I love"],["odio","I hate"],["prefiero","I prefer"],["creo que…","I think that…"],["pienso que…","I think that…"],["en mi opinión","in my opinion"],["estoy de acuerdo","I agree"],["no estoy de acuerdo","I disagree"],["¿qué piensas?","what do you think?"],["¿qué te parece?","what do you think of it?"],["tienes razón","you're right"],["es verdad","it's true"],["es genial","it's great"],["es una pasada","it's awesome (Spain)"],["es horrible","it's awful"]],
phrases:[["Me gustan los videojuegos porque son divertidos.","I like video games because they're fun."],["Prefiero el fútbol al tenis.","I prefer football to tennis."],["Creo que el examen fue difícil.","I think the exam was difficult."],["¿Qué piensas de la película?","What do you think of the film?"],["Estoy de acuerdo contigo.","I agree with you."]],
quiz:[["Complete: Me ___ los videojuegos.","gustan","gusta","gusto","gustas"],["Complete: ¿___ gusta el fútbol? (to you)","Te","Me","Le","Nos"],["“Estoy de acuerdo” means…","I agree","I'm tired","I disagree","I'm ready"],["Complete: A ella ___ gusta bailar.","le","me","te","les"],["TYPE: I prefer tea","prefiero el té|prefiero té"],["ORDER: I think that it is great","Creo que es genial"]],
speak:["Give an opinion on five things: a film, a game, a food, a subject, a team. Use a reason with porque.","Disagree politely with something: “No estoy de acuerdo porque…”","Ask Claude what it thinks of football: “¿Qué piensas del fútbol?”"]});

L({m:2,t:"Ordering food",
intro:"Restaurants and cafés are one of the best places to practise real Spanish. The language is predictable, which makes it a great confidence builder.",
notes:[
"<b>Quisiera</b> or <b>Me gustaría</b> (I would like) is politer than <b>quiero</b>.",
"<b>El menú del día</b> in Spain is a fixed-price lunch: starter (primero), main (segundo), dessert (postre) and a drink.",
"Ask for things with <b>¿Me trae…?</b> (Could you bring me…?), <b>¿Tiene…?</b> (Do you have…?), <b>¿Hay…?</b> (Is there…?).",
"Dietary needs: <b>Soy vegetariano / vegetariana.</b> <b>Soy alérgico / alérgica a…</b>",
"In Spain tips are small and optional. Rounding up is fine."],
vocab:[["una mesa para dos","a table for two"],["la carta / el menú","menu"],["quisiera…","I would like…"],["¿qué me recomienda?","what do you recommend?"],["de primero","for starter"],["de segundo","for main"],["de postre","for dessert"],["para beber","to drink"],["el agua con gas","sparkling water"],["el agua sin gas","still water"],["la cuenta","the bill"],["¿me trae la cuenta?","could you bring me the bill?"],["¿puedo pagar con tarjeta?","can I pay by card?"],["está delicioso","it's delicious"],["sin…","without…"],["con…","with…"],["el camarero / la camarera","waiter / waitress"],["la propina","tip"],["soy alérgico/a a…","I'm allergic to…"],["¡que aproveche!","enjoy your meal!"]],
dialogue:{t:"At a restaurant",lines:[["Camarero","Buenas tardes. ¿Qué van a tomar?","Good afternoon. What will you have?"],["Cliente","De primero, quisiera una ensalada. De segundo, pollo con patatas.","For starter I'd like a salad. For main, chicken with potatoes."],["Camarero","¿Y para beber?","And to drink?"],["Cliente","Agua sin gas, por favor.","Still water, please."],["Camarero","Muy bien. ¿Quiere postre?","Very good. Would you like dessert?"],["Cliente","Sí, un helado. Y la cuenta, por favor.","Yes, an ice cream. And the bill, please."],["Camarero","Ahora mismo.","Right away."]]},
quiz:[["Which is the politest way to order?","Quisiera una pizza","Quiero una pizza","Dame una pizza","Una pizza"],["“La cuenta” means…","the bill","the menu","the tip","the table"],["“De postre” means…","for dessert","for starter","for main","to drink"],["TYPE: The bill, please","la cuenta, por favor"],["ORDER: I would like a salad","Quisiera una ensalada"]],
speak:["Role-play ordering a full meal: starter, main, drink, dessert, bill.","Ask for something without an ingredient: “Sin queso, por favor.”","Ask the waiter what he recommends and respond."]});

L({m:2,t:"Shopping",
intro:"Buy clothes, ask prices and negotiate sizes. The same patterns work for any shop.",
notes:[
"<b>Cuesta</b> (singular) vs <b>cuestan</b> (plural): ¿Cuánto cuesta la camiseta? ¿Cuánto cuestan las zapatillas?",
"<b>Demasiado</b> = too (much): demasiado caro, demasiado grande.",
"<b>Me lo llevo</b> = I'll take it (me los llevo for plural, me la llevo for feminine).",
"Sizes: <b>la talla</b> for clothes, <b>el número</b> for shoes. Spain uses European sizes: Uso el cuarenta.",
"Shop assistants say <b>usted</b>: ¿Puedo ayudarle? (Can I help you?)."],

L({m:2,t:"Talking about football ⚽",
intro:"Football is the easiest way into real Spanish conversation. People will talk about it with you anywhere in Spain or Latin America.",
notes:[

"Your team: <b>Soy del Barça / Soy del Real Madrid / Soy del Liverpool</b>, or ¿De qué equipo eres?",
"Scores: <b>dos a uno</b> (2–1). Ganamos dos a uno. Empatamos cero a cero.",
"Past tense helps: marcó (he scored), ganó (they won), perdió (they lost), empató (they drew).",
"The national team is <b>la selección</b>. The domestic league is <b>La Liga</b>."],
vocab:[["el fútbol","football"],["el partido","match"],["el equipo","team"],["el jugador","player"],["el portero","goalkeeper"],["el defensa","defender"],["el centrocampista","midfielder"],["el delantero","striker"],["el entrenador","coach"],["el árbitro","referee"],["el gol","goal"],["el penalti","penalty"],["la liga","league"],["el estadio","stadium"],["el aficionado","fan"],["la selección","national team"],["marcar un gol","to score a goal"],["ganar","to win"],["perder","to lose"],["empatar","to draw"],["¿de qué equipo eres?","which team do you support?"],["¡gol!","goal!"]],
dialogue:{t:"Talking about a match",lines:[["Dani","¿De qué equipo eres?","Which team do you support?"],["Sam","Soy del Liverpool. ¿Y tú?","I support Liverpool. And you?"],["Dani","Yo soy del Barça. Ayer vi el partido.","I support Barça. Yesterday I watched the match."],["Sam","¿Ganó el Barça?","Did Barça win?"],["Dani","Sí, ganó dos a uno. El delantero marcó dos goles.","Yes, they won two–one. The striker scored two goals."],["Sam","¡Qué bueno! Mi equipo empató el sábado.","Great! My team drew on Saturday."]]},

speak:["Say who you support, your favourite player and why.","Tell the story of the last match you watched in the past tense.","Predict the next match: “Creo que ganará…”"]});

L({m:2,t:"Talking about games 🎮",
intro:"Invite friends to play, talk about levels and wins and sound natural in a gaming chat.",
tables:[conj("jugar · to play (u → ue)",["juego","juegas","juega","jugamos","jugáis","juegan"],tr("play"))],
notes:[
"<b>jugar a + game or sport</b>: Juego al fútbol (a + el = al), juego a Minecraft, juego a las cartas.",
"Jugar is a <b>boot verb</b>: u → ue in every form except nosotros and vosotros.",
"<b>Me toca a mí</b> = it's my turn. <b>Te toca a ti</b> = your turn.",
"Spain says <b>el mando</b> for a controller. Many Latin American countries say <b>el control</b>.",
"Plenty of English gaming words are used as they are: stream, online, nivel, skin."],
vocab:[["el videojuego","video game"],["la consola","console"],["el mando","controller"],["la partida","game / round"],["el nivel","level"],["el personaje","character"],["el jugador / la jugadora","player"],["en línea","online"],["el juego de mesa","board game"],["¿quieres jugar?","do you want to play?"],["me toca a mí","it's my turn"],["te toca a ti","it's your turn"],["es muy difícil","it's very hard"],["otra vez","again"],["una más","one more"],["¡qué suerte!","what luck!"],["mala suerte","bad luck"],["sin problema","no problem"],["seguidas","in a row"],["¡buena partida!","good game!"]],
dialogue:{t:"Gaming chat",lines:[["Dani","¿Quieres jugar una partida esta noche?","Do you want to play a game tonight?"],["Sam","Vale, pero tengo que hacer los deberes primero.","OK, but I have to do my homework first."],["Dani","Sin problema. Yo juego con el mando nuevo.","No problem. I'm playing with the new controller."],["Sam","¡Qué guay! ¿Qué nivel tienes?","How cool! What level are you?"],["Dani","Estoy en el nivel veinte. Ayer perdí cinco partidas seguidas.","I'm on level twenty. Yesterday I lost five games in a row."],["Sam","¡Mala suerte! Esta noche vamos a ganar.","Bad luck! Tonight we're going to win."]]},
quiz:[["Complete: Juego ___ ajedrez.","al","a","el","en"],["Complete: Mi hermano ___ con la consola.","juega","juego","jugamos","jugar"],["Complete: Nosotros ___ al fútbol.","jugamos","juegamos","juego","jugan"],["“Me toca a mí” means…","It's my turn","I like it","I'm tired","I won"],["TYPE: Do you want to play?","¿quieres jugar?"],["ORDER: Yesterday I lost five games","Ayer perdí cinco partidas"]],
speak:["Invite a friend to play and agree on a time.","Describe your favourite game: what it is, what you do, what level you're on.","Tell the story of a game you won or lost yesterday."]});

L({m:2,t:"Describing people and places",
intro:"Paint a picture with words: how someone looks, what they're like, and what a place is like.",
tables:[{h:"Adjective agreement",head:["","masculine","feminine"],rows:[["singular","alto","alta"],["plural","altos","altas"],["ends in -e (sing.)","inteligente","inteligente"],["ends in -e (pl.)","inteligentes","inteligentes"]]}],
notes:[
"<b>Adjectives agree</b> with the noun in gender and number, and usually come <b>after</b> it: una ciudad grande, unos amigos simpáticos.",
"<b>Ser</b> for description: Es alto. Es simpática. <b>Tener</b> for hair and eyes: Tiene el pelo corto y los ojos azules.",
"<b>Llevar</b> = to wear: Lleva gafas. Llevo una sudadera.",
"<b>Hay</b> = there is / are: Hay un parque y dos tiendas.",
"Soften with <b>bastante</b> (quite), <b>un poco</b> (a bit), <b>muy</b> (very)."],
vocab:[["alto / alta","tall"],["bajo / baja","short"],["delgado / delgada","slim"],["fuerte","strong"],["joven","young"],["mayor","older"],["moreno / morena","dark-haired"],["rubio / rubia","blond"],["el pelo","hair"],["corto / largo","short / long"],["los ojos","eyes"],["azules / marrones / verdes","blue / brown / green"],["llevar gafas","to wear glasses"],["simpático / simpática","nice"],["antipático","unfriendly"],["divertido","funny"],["tímido","shy"],["inteligente","clever"],["trabajador","hard-working"],["perezoso","lazy"],["grande","big"],["pequeño","small"],["bonito","pretty / nice"],["feo","ugly"],["antiguo","old (things)"],["moderno","modern"],["tranquilo","quiet"],["ruidoso","noisy"],["la ciudad","city"],["hay","there is / are"]],
phrases:[["Mi mejor amigo es alto y moreno.","My best friend is tall and dark-haired."],["Tiene el pelo corto y los ojos marrones.","He has short hair and brown eyes."],["Mi ciudad es grande y ruidosa.","My city is big and noisy."],["En mi barrio hay un parque y dos tiendas.","In my area there is a park and two shops."],["Lleva gafas y una sudadera azul.","He's wearing glasses and a blue hoodie."]],

L({m:2,t:"Longer conversations",
intro:"The skill that moves you from phrases to talking: connectors, fillers and follow-up questions that keep a chat going.",
notes:[
"<b>Order your story:</b> primero, luego, después, por último.",
"<b>Connect ideas:</b> además (besides), por ejemplo, sin embargo (however), por eso (that's why), entonces (so).",
"<b>Sound natural:</b> bueno, pues, vale, a ver, es que… (the thing is…), o sea (I mean).",
"<b>Keep it going:</b> ¿Y tú? ¿En serio? ¿De verdad? ¿Y por qué? Always ask something back."],
vocab:[["primero","first"],["luego","then"],["después","afterwards"],["por último","finally"],["además","besides / also"],["por ejemplo","for example"],["sin embargo","however"],["por eso","that's why"],["entonces","so / then"],["bueno","well"],["pues","well…"],["vale","OK"],["a ver","let's see"],["es que…","the thing is…"],["o sea","I mean"],["¿en serio?","seriously?"],["¿de verdad?","really?"],["así que","so"],["¡qué envidia!","I'm jealous!"],["mucha suerte","good luck"],["la película","film"]],
dialogue:{t:"Talking about the weekend",lines:[["Ana","Hola, Sam. ¿Qué tal el fin de semana?","Hi, Sam. How was your weekend?"],["Sam","Bueno, no estuvo mal. El sábado jugué al fútbol y luego fui al cine con mi primo.","Well, it wasn't bad. On Saturday I played football and then went to the cinema with my cousin."],["Ana","¿En serio? ¿Qué película viste?","Really? What film did you see?"],["Sam","Vimos una de acción. Además, comimos pizza, así que fue un día perfecto.","We saw an action one. Also, we ate pizza, so it was a perfect day."],["Ana","¡Qué envidia! Yo no hice nada. Es que tuve que estudiar para el examen.","I'm jealous! I didn't do anything. The thing is, I had to study for the exam."],["Sam","Ah, vale. ¿Crees que va a ser difícil?","Ah, OK. Do you think it's going to be hard?"],["Ana","Pues sí, un poco. Por eso voy a estudiar esta noche.","Well yes, a bit. That's why I'm going to study tonight."],["Sam","Mucha suerte. Y el domingo, ¿qué hiciste?","Good luck. And on Sunday, what did you do?"],["Ana","Nada especial. Vi la tele con mi madre. ¿Y tú?","Nothing special. I watched TV with my mum. And you?"],["Sam","Descansé. Fue un fin de semana tranquilo.","I rested. It was a quiet weekend."]]},
quiz:[["“Sin embargo” means…","however","also","for example","so"],["Which word means “besides / also”?","además","luego","entonces","pues"],["“¿En serio?” is used to say…","Really?","Where?","How much?","Who?"],["Complete: No entendí nada. ___ pregunté.","Por eso","Por ejemplo","También","Pero"],["TYPE: for example","por ejemplo"],["ORDER: First I did my homework","Primero hice los deberes"]],
speak:["Talk for one minute about your weekend. Use primero, luego, además and por eso.","Practise four follow-up questions: ¿Y tú? ¿En serio? ¿Por qué? ¿Cuándo?","Re-read the dialogue out loud, playing both parts, then change the details to your own life."]});

L({m:3,t:"Real Spanish conversations",
intro:"Real conversations are messy. People repeat, interrupt and use words you don't know. This lesson gives you the phrases to stay in the conversation when that happens.",
notes:[
"<b>Never switch to English.</b> Ask for help in Spanish: ¿Puedes repetir? ¿Cómo se dice…? ¿Qué significa…?",
"<b>Ask for slower, not simpler:</b> Más despacio, por favor.",
"<b>Guess out loud:</b> Creo que significa… Is it…? Native speakers love helping learners.",
"<b>Use the dialogue below</b> twice: first with English hidden, then play Sam's lines aloud."],
vocab:[["¿puedes repetir?","can you repeat?"],["más despacio, por favor","slower, please"],["¿qué significa…?","what does… mean?"],["¿cómo se dice… en español?","how do you say… in Spanish?"],["no lo sé","I don't know"],["creo que sí","I think so"],["creo que no","I don't think so"],["¿perdona?","pardon?"],["no te entiendo","I don't understand you"],["¿me puedes ayudar?","can you help me?"],["un momento, por favor","one moment, please"],["¡claro que sí!","of course!"],["lo siento","I'm sorry"],["el intercambio","exchange (school)"],["se dice…","you say…"]],
dialogue:{t:"A new exchange student",hideEn:true,lines:[["Lucía","Hola, soy Lucía. Soy de Sevilla.","Hi, I'm Lucía. I'm from Seville."],["Sam","Hola, Lucía. Encantado. Perdona, ¿puedes hablar más despacio?","Hi, Lucía. Pleased to meet you. Sorry, can you speak more slowly?"],["Lucía","Claro. Soy… de… Sevilla. Estoy aquí una semana.","Of course. I'm… from… Seville. I'm here for a week."],["Sam","Ah, vale. ¿Cómo se dice “exchange student” en español?","Ah, OK. How do you say “exchange student” in Spanish?"],["Lucía","Se dice “alumna de intercambio”.","You say “alumna de intercambio”."],["Sam","Gracias. ¿Te gusta Dublín?","Thanks. Do you like Dublin?"],["Lucía","Sí, mucho, pero hace frío. ¿Conoces Sevilla?","Yes, a lot, but it's cold. Do you know Seville?"],["Sam","No, pero quiero ir algún día. ¿Qué significa “chulo”?","No, but I want to go one day. What does “chulo” mean?"],["Lucía","Significa “bonito” o “cool”. ¡Sevilla es chula!","It means “pretty” or “cool”. Seville is cool!"]]},
quiz:[["How do you ask someone to repeat?","¿Puedes repetir?","¿Puedes comer?","¿Puedes ganar?","¿Puedes pagar?"],["“Más despacio” means…","slower","faster","louder","again"],["“¿Qué significa…?” asks…","What does it mean?","What is your name?","What time is it?","Where is it?"],["TYPE: I don't understand","no entiendo"],["ORDER: How do you say it in Spanish?","¿Cómo se dice en español?"]],
speak:["Practise the repair phrases until you can say all five without looking.","Read Sam's lines aloud, then answer Lucía's questions about you instead.","Have a 3-minute chat with Claude in Spanish and use at least three repair phrases."]});

L({m:3,t:"Faster listening",
intro:"Spanish sounds fast because words blend together and speakers shorten them. Train your ear with slowed audio, then move up to full speed.",
notes:[
"<b>Words link.</b> ¿Qué haces? is heard as “ke-á-ses”. Listen for chunks, not single words.",
"<b>Casual speech shortens words:</b> para → <b>pa'</b>, estoy → <b>toy</b>, está → <b>tá</b>, todo → <b>to'</b>, nada → <b>na'</b>.",
"<b>Three passes:</b> 1) listen with nothing in front of you and note the gist. 2) listen with the Spanish text. 3) check the English. Then replay at a faster speed.",
"<b>Numbers and times</b> go by quickly. Replay them on their own until they feel automatic.",
"Use the speed buttons on the dialogue: Slow, Normal, Fast."],
vocab:[["pa'","for (short for para)"],["toy","I'm (short for estoy)"],["tá","is (short for está)"],["to'","all (short for todo)"],["na'","nothing (short for nada)"],["¿qué tal?","how's it going?"],["ni idea","no idea"],["oye","hey / listen"],["¿vamos?","shall we go?"],["ahora mismo","right now"],["más o menos","more or less"],["la entrada","ticket"],["el derbi","derby"],["la bufanda","scarf"],["tranquilo","relax / calm"],["no llegues tarde","don't be late"],["delante de","in front of"]],
dialogue:{t:"Making plans for the derby",hideEn:true,lines:[["Dani","Oye, ¿qué haces el sábado? Hay un partido en el estadio a las seis.","Hey, what are you doing on Saturday? There's a match at the stadium at six."],["Sam","No sé, a lo mejor tengo que estudiar. ¿Cuánto cuestan las entradas?","I don't know, I might have to study. How much are the tickets?"],["Dani","Veinte euros, más o menos. Es el derbi, hombre. Va a estar lleno.","Twenty euros, more or less. It's the derby, man. It's going to be full."],["Sam","¡Venga! Pues vale. ¿Quedamos a las cinco delante del metro?","Come on! OK then. Shall we meet at five in front of the metro?"],["Dani","Perfecto. Yo llevo las bufandas. Y no llegues tarde, ¿eh?","Perfect. I'll bring the scarves. And don't be late, OK?"],["Sam","Tranquilo, tío. Nos vemos el sábado.","Relax, mate. See you Saturday."]]},
quiz:[["“Pa'” in fast speech is short for…","para","pero","paso","pan"],["“¿Qué tal?” means…","How's it going?","What time?","Which one?","What for?"],["“Ni idea” means…","No idea","New idea","Nice idea","Good idea"],["From the dialogue: how much are the tickets?","About €20","About €6","About €50","They're free"],["From the dialogue: where do they meet?","In front of the metro","At the stadium","At school","At Dani's house"],["From the dialogue: when do they meet?","At five","At six","At eight","At noon"]],
speak:["Listen to the dialogue three times (Slow, Normal, Fast) without reading.","Write down the numbers you hear: times, prices and the day.","Retell the dialogue in your own words in 4 sentences."]});

L({m:3,t:"Slang and natural phrases",
intro:"Textbook Spanish is correct. Slang is what people actually say. This is mostly Spain, with a few Latin American equivalents.",
notes:[
"<b>Slang changes by country and age.</b> “Tío / tía” (mate, dude) is everywhere in Spain but sounds odd in Mexico or Argentina.",
"<b>Use slang with friends</b>, not with teachers or shop staff. Two or three phrases per conversation is plenty.",
"<b>Reactions are the safest slang:</b> ¡Qué fuerte! ¡Madre mía! ¡Anda! ¡Venga! Everyone understands them.",
"<b>Latin America equivalents:</b> chévere (Colombia, Venezuela), padre (Mexico), bacán (Chile, Peru) all mean “cool”.",
"Skip swearing until you can read a room in Spanish."],
vocab:[["vale","OK"],["guay","cool"],["mola","it's cool / I like it"],["el tío / la tía","mate / dude (Spain)"],["el chaval / la chavala","lad / lass"],["flipar","to be amazed"],["¡qué fuerte!","wow! / that's crazy!"],["¡qué va!","no way! / not at all"],["¡madre mía!","oh my goodness!"],["¡anda!","wow! / no way!"],["¡venga!","come on! / OK then"],["estar hecho polvo","to be exhausted"],["estar harto / harta","to be fed up"],["me da igual","I don't mind"],["en plan","like (filler)"],["¡qué rollo!","what a drag!"],["la pasta","money (informal)"],["currar","to work (informal)"],["chulo","cool / nice"],["majo / maja","nice (person)"],["¡qué pena!","what a shame!"],["chévere / padre / bacán","cool (Latin America)"]],
dialogue:{t:"Two friends talking",lines:[["Dani","¡Tío! ¿Viste el partido ayer? Fue una pasada.","Dude! Did you see the match yesterday? It was awesome."],["Sam","¡Qué va, no lo vi! Estaba hecho polvo después del entrenamiento.","No way, I didn't see it! I was exhausted after training."],["Dani","¡Madre mía! Marcaron en el último minuto. Flipé.","Oh my goodness! They scored in the last minute. I freaked out."],["Sam","¡Qué fuerte! Qué rollo perdérmelo.","That's crazy! What a drag to miss it."],["Dani","Venga, mañana vemos la repetición. Me da igual la hora.","Come on, tomorrow we'll watch the replay. I don't mind the time."],["Sam","Vale, guay. Eres un tío majo.","OK, cool. You're a nice guy."]]},
quiz:[["“Guay” means…","cool","tired","expensive","boring"],["“Estar hecho polvo” means…","to be exhausted","to be dusty","to be rich","to be late"],["“¡Qué va!” is used to say…","No way!","How lovely!","Hello!","See you!"],["Who would you say “tío” to?","A friend (Spain)","A teacher","A shop assistant","Your grandmother"],["TYPE: I'm fed up (estar harto)","estoy harto|estoy harta"],["ORDER: That is very cool","Eso es muy guay"]],
speak:["Use three reactions in a mini chat: ¡Qué fuerte! ¡Madre mía! ¡Venga!","Say how you feel after a long day using estar hecho polvo and harto.","Retell last night's game or episode using 3 slang words."]});

L({m:3,t:"Storytelling",
intro:"To tell a story you need two past tenses. The preterite says what happened. The imperfect sets the scene: what things were like and what used to happen.",
tables:[conj("jugar · imperfect",["jugaba","jugabas","jugaba","jugábamos","jugabais","jugaban"],["I was playing / used to play","you were playing","he / she was playing","we were playing","you all were playing","they were playing"]),conj("comer · imperfect",["comía","comías","comía","comíamos","comíais","comían"]),{h:"Only three irregular imperfects",head:["","ser","ir","ver"],rows:[["yo","era","iba","veía"],["tú","eras","ibas","veías"],["él / ella","era","iba","veía"],["nosotros","éramos","íbamos","veíamos"],["ellos","eran","iban","veían"]]}],
notes:[
"<b>Preterite = events.</b> Things that happened and finished: De repente, llegó mi primo.",
"<b>Imperfect = background and habits.</b> What things were like: Hacía sol. I was happy. We used to play every day.",
"<b>Imperfect endings:</b> -ar → aba, abas, aba, ábamos, abais, aban. -er/-ir → ía, ías, ía, íamos, íais, ían.",
"<b>Story starters:</b> Érase una vez… (Once upon a time), un día, de repente, entonces, mientras, al final, por fin."],
vocab:[["érase una vez","once upon a time"],["un día","one day"],["de repente","suddenly"],["entonces","then"],["mientras","while"],["al final","in the end"],["por fin","at last"],["el balón","ball"],["hacía sol","it was sunny"],["estaba","I was / he was (state)"],["jugábamos","we were playing"],["llegó","he / she arrived"],["empezó a llover","it started to rain"],["iba","I used to go / I was going"],["era","I was / it was"]],
dialogue:{t:"Una historia",lines:[["","Ayer fue un día increíble.","Yesterday was an amazing day."],["","Hacía sol y yo estaba muy contento.","It was sunny and I was very happy."],["","Estaba en el parque con mis amigos y jugábamos al fútbol.","I was in the park with my friends and we were playing football."],["","De repente, llegó mi primo con un balón nuevo.","Suddenly, my cousin arrived with a new ball."],["","Mientras jugábamos, empezó a llover, pero no paramos.","While we were playing it started to rain, but we didn't stop."],["","Al final, ganamos tres a dos y fuimos a comer pizza.","In the end we won 3–2 and went to eat pizza."]]},
quiz:[["“Hacía sol” uses which tense?","Imperfect (background)","Preterite (event)","Future","Present"],["Complete: Mientras yo ___, mi hermano llegó. (jugar)","jugaba","jugué","juego","jugaré"],["Complete: De repente, ___. (llover)","llovió","llovía","llueve","lloverá"],["Complete: Cuando era pequeño, ___ al parque cada día. (ir)","iba","fui","voy","iré"],["TYPE: It was sunny","hacía sol"],["ORDER: In the end we won","Al final ganamos"]],
speak:["Tell a short story with three events (preterite) and two descriptions (imperfect).","Describe what your life used to be like when you were small.","Use érase una vez to start a fairy tale of your own."]});

L({m:3,t:"Talking about plans",
intro:"Invite someone, accept or politely say no, and agree a time and place. The language of making plans is very repetitive and very useful.",
notes:[

let activeLanguage='es';
const U30=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
const TENS=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
const HUND=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
function numToEs(n){
  if(n<30)return U30[n];
  if(n<100){const t=Math.floor(n/10),u=n%10;return TENS[t]+(u?" y "+U30[u]:"");}
  if(n<1000){if(n===100)return "cien";const h=Math.floor(n/100),r=n%100;return HUND[h]+(r?" "+numToEs(r):"");}
  const th=Math.floor(n/1000),r=n%1000;return (th===1?"mil":numToEs(th)+" mil")+(r?" "+numToEs(r):"");
}
function numToFr(n){
 const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
 if(n<17)return u[n]; if(n<20)return 'dix-'+u[n-10];
 if(n<70){const tens=['','','','trente','quarante','cinquante','soixante'],t=Math.floor(n/10),r=n%10;return tens[t]+(r?(r===1?' et un':'-'+u[r]):'');}
 if(n<80)return 'soixante-'+(n===71?'et onze':numToFr(n-60));
 if(n<100){if(n===80)return 'quatre-vingts';return 'quatre-vingt-'+numToFr(n-80);}
 if(n===100)return 'cent';if(n<1000){const h=Math.floor(n/100),r=n%100;return (h===1?'cent':u[h]+' cent')+(r?' '+numToFr(r):'s');}
 if(n<10000){const th=Math.floor(n/1000),r=n%1000;return (th===1?'mille':numToFr(th)+' mille')+(r?' '+numToFr(r):'');}
 return String(n);
}
function numToIt(n){
 const u=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'];
 const tens=['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
 if(n<20)return u[n];
 if(n<100){const t=Math.floor(n/10),r=n%10;let stem=tens[t];if(r===1||r===8)stem=stem.slice(0,-1);return stem+(r?u[r]:'');}
 if(n===100)return 'cento';if(n<1000){const h=Math.floor(n/100),r=n%100;return (h===1?'cento':u[h]+'cento')+(r?numToIt(r):'');}
 if(n<10000){const th=Math.floor(n/1000),r=n%1000;return (th===1?'mille':numToIt(th)+'mila')+(r?numToIt(r):'');}
 return String(n);
}
// Irish standalone/counting numbers used by the practice engine (up to 9,999).
function numToGa(n){
 const u=['náid','a haon','a dó','a trí','a ceathair','a cúig','a sé','a seacht','a hocht','a naoi'];
 const teen=['a deich','a haon déag','a dó dhéag','a trí déag','a ceathair déag','a cúig déag','a sé déag','a seacht déag','a hocht déag','a naoi déag'];
 const tens={20:'fiche',30:'tríocha',40:'daichead',50:'caoga',60:'seasca',70:'seachtó',80:'ochtó',90:'nócha'};
 if(!Number.isFinite(n)||n<0||n>9999)return String(n);
 if(n<10)return u[n];
 if(n<20)return teen[n-10];
 if(n===100)return 'céad';
 if(n<100){const t=Math.floor(n/10)*10,r=n%10;return tens[t]+(r?' '+u[r]:'');}
 if(n<1000){const h=Math.floor(n/100),r=n%100;const hundreds={1:'céad',2:'dhá chéad',3:'trí chéad',4:'ceithre chéad',5:'cúig chéad',6:'sé chéad',7:'seacht gcéad',8:'ocht gcéad',9:'naoi gcéad'};return hundreds[h]+(r?' '+numToGa(r):'');}
 const th=Math.floor(n/1000),r=n%1000;const thousands=th===1?'míle':numToGa(th).replace(/^a /,'')+' míle';return thousands+(r?' '+numToGa(r):'');
}
function numToTarget(n){return activeLanguage==='fr'?numToFr(n):activeLanguage==='it'?numToIt(n):activeLanguage==='ga'?numToGa(n):numToEs(n);}
