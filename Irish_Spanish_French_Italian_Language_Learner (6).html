 {m:1,t:"Numbers and age",intro:"Learn useful numbers and how to say how old you are.",notes:["French numbers 17–19 combine dix with the units: dix-sept, dix-huit, dix-neuf.","Age uses <b>avoir</b> (to have): <b>J’ai douze ans</b> means “I am twelve years old”.","Listen for the links between words when you say a full number."],vocab:[["zéro","zero"],["un","one"],["deux","two"],["trois","three"],["quatre","four"],["cinq","five"],["six","six"],["sept","seven"],["huit","eight"],["neuf","nine"],["dix","ten"],["onze","eleven"],["douze","twelve"],["treize","thirteen"],["quatorze","fourteen"],["quinze","fifteen"],["seize","sixteen"],["vingt","twenty"],["trente","thirty"],["quarante","forty"],["cinquante","fifty"],["cent","one hundred"],["j’ai … ans","I am … years old"]],phrases:[["J’ai douze ans.","I am twelve years old."],["Il y a trois personnes.","There are three people."],["Ça coûte dix euros.","It costs ten euros."]],quiz:[["What number is “huit”?","8","6","9","10"],["How do you say “twelve”?","douze","treize","deux","dix"],["“J’ai douze ans” means…","I am twelve years old","I have twelve books","I am twelve people","I want twelve"],["TYPE: Write “five” in French","cinq"],["ORDER: It costs ten euros","Ça coûte dix euros"]],speak:["Count from zero to twenty in French.","Say your age using J’ai … ans.","Say three prices using euros."]},
 {m:1,t:"Family and friends",intro:"Talk about your family, friends and pets.",notes:["Most French nouns have a gender: <b>un</b> is masculine and <b>une</b> is feminine.","Use <b>mon/ma/mes</b> for “my”; the form changes depending on the noun.","To say you have someone or something, use <b>j’ai</b>."],vocab:[["la famille","family"],["la mère","mother / mum"],["le père","father / dad"],["les parents","parents"],["le frère","brother"],["la sœur","sister"],["la grand-mère","grandmother"],["le grand-père","grandfather"],["la tante","aunt"],["l’oncle","uncle"],["le cousin","male cousin"],["la cousine","female cousin"],["l’ami / l’amie","friend"],["le chien","dog"],["le chat","cat"],["mon / ma / mes","my"]],phrases:[["J’ai un frère.","I have a brother."],["Ma famille est sympa.","My family is nice."],["Mon ami s’appelle Lucas.","My friend is called Lucas."],["J’ai un chien et un chat.","I have a dog and a cat."]],quiz:[["Which means “mother”?","la mère","le père","la sœur","la tante"],["“Le chien” is…","the dog","the cat","the horse","the bird"],["How do you say “my family”?","ma famille","mon famille","mes famille","la ma famille"],["TYPE: I have a brother","j’ai un frère"],["ORDER: My friend is called Lucas","Mon ami s’appelle Lucas"]],speak:["Describe who is in your family.","Say whether you have brothers, sisters or pets.","Introduce a friend in two French sentences."]},
 {m:1,t:"At school",intro:"Learn words for school, lessons and things in your school bag.",notes:["<b>J’aime</b> means “I like”; <b>je n’aime pas</b> means “I don't like”.","In French, adjectives often come after the noun: un livre intéressant.","School subject names are usually not capitalised in French."],vocab:[["l’école","school"],["la classe","classroom / class"],["le professeur","teacher"],["l’élève","student"],["le livre","book"],["le cahier","notebook"],["le stylo","pen"],["le sac à dos","backpack"],["les devoirs","homework"],["l’examen","exam"],["les maths","maths"],["l’anglais","English"],["l’histoire","history"],["les sciences","science"],["le sport","sport"],["facile","easy"],["difficile","difficult"],["amusant","fun"]],phrases:[["J’aime les maths.","I like maths."],["Les devoirs sont difficiles.","The homework is difficult."],["J’ai un examen lundi.","I have an exam on Monday."],["Mon cours préféré est le sport.","My favourite subject is PE."]],quiz:[["“Le cahier” means…","notebook","backpack","teacher","exam"],["How do you say “I like maths”?","J’aime les maths","Je suis les maths","J’ai les maths","J’aime le maths"],["Which means “homework”?","les devoirs","les sciences","le stylo","l’école"],["TYPE: book","livre"],["ORDER: I have an exam on Monday","J’ai un examen lundi"]],speak:["Say three subjects you study.","Describe what is in your school bag.","Give one subject you like and one you don't like."]},
 {m:2,t:"Food and drink",intro:"Order a snack, name foods and say what you like to eat or drink.",notes:["<b>Je voudrais…</b> is a polite way to order something: “I would like…”.","Use <b>j’ai faim</b> for “I’m hungry” and <b>j’ai soif</b> for “I’m thirsty”.","A few words have special forms: <b>de l’eau</b> means “some water”."],vocab:[["l’eau","water"],["le lait","milk"],["le jus","juice"],["le pain","bread"],["le fromage","cheese"],["le poulet","chicken"],["le poisson","fish"],["le riz","rice"],["les pommes de terre","potatoes"],["la pomme","apple"],["la banane","banana"],["la fraise","strawberry"],["la salade","salad"],["la pizza","pizza"],["la glace","ice cream"],["le petit-déjeuner","breakfast"],["le déjeuner","lunch"],["le dîner","dinner"],["j’ai faim","I’m hungry"],["j’ai soif","I’m thirsty"],["je voudrais…","I would like…"]],phrases:[["Je voudrais un jus, s’il vous plaît.","I would like a juice, please."],["J’aime la pizza.","I like pizza."],["Je n’aime pas le poisson.","I don't like fish."],["L’addition, s’il vous plaît.","The bill, please."]],quiz:[["“Le pain” means…","bread","cheese","rice","fish"],["How do you say “I’m thirsty”?","J’ai soif","Je suis soif","J’ai faim","Je veux soif"],["Which is a fruit?","la fraise","le poulet","le riz","le fromage"],["TYPE: water","eau"],["ORDER: I would like a juice, please","Je voudrais un jus s’il vous plaît"]],speak:["Order a drink politely.","Name five foods you enjoy.","Say what you usually eat for breakfast."]},
 {m:2,t:"Days, dates and time",intro:"Use days, months and clock times to talk about your plans.",notes:["Days and months are written in lowercase in French.","Use <b>Il est une heure</b> for one o’clock and <b>Il est deux heures</b> for two o’clock.","<b>et quart</b> means quarter past; <b>et demie</b> means half past."],vocab:[["lundi","Monday"],["mardi","Tuesday"],["mercredi","Wednesday"],["jeudi","Thursday"],["vendredi","Friday"],["samedi","Saturday"],["dimanche","Sunday"],["janvier","January"],["février","February"],["mars","March"],["avril","April"],["mai","May"],["juin","June"],["juillet","July"],["août","August"],["septembre","September"],["octobre","October"],["novembre","November"],["décembre","December"],["aujourd’hui","today"],["demain","tomorrow"],["hier","yesterday"],["Quelle heure est-il ?","What time is it?"]],phrases:[["Aujourd’hui, c’est vendredi.","Today is Friday."],["Mon anniversaire est en mai.","My birthday is in May."],["Il est huit heures et demie.","It is half past eight."],["Le match est samedi.","The match is on Saturday."]],quiz:[["“Demain” means…","tomorrow","yesterday","today","Monday"],["Which means “Friday”?","vendredi","jeudi","samedi","mardi"],["“Il est huit heures” is…","8 o’clock","2 o’clock","half past eight","quarter past eight"],["TYPE: Monday","lundi"],["ORDER: Today is Friday","Aujourd’hui c’est vendredi"]],speak:["Say the days of the week in French.","Say what day your next match or activity is on.","Tell the time at three different points in your day."]},
 {m:2,t:"Places and directions",intro:"Find your way around a town and ask where places are.",notes:["Ask <b>Où est… ?</b> to mean “Where is…?”","<b>à droite</b> means right, <b>à gauche</b> means left and <b>tout droit</b> means straight ahead.","<b>Il y a</b> means “there is” or “there are”."],vocab:[["la maison","house"],["la rue","street"],["le magasin","shop"],["le supermarché","supermarket"],["le parc","park"],["le stade","stadium"],["la gare","train station"],["l’hôpital","hospital"],["la plage","beach"],["le cinéma","cinema"],["le restaurant","restaurant"],["les toilettes","toilet / bathroom"],["Où est… ?","Where is…?"],["à droite","to the right"],["à gauche","to the left"],["tout droit","straight ahead"],["près de","near"],["loin de","far from"],["à côté de","next to"]],phrases:[["Où est la gare ?","Where is the station?"],["Allez tout droit.","Go straight ahead."],["Tournez à gauche.","Turn left."],["Le stade est près du parc.","The stadium is near the park."]],quiz:[["“À gauche” means…","to the left","to the right","straight ahead","far away"],["Which means “train station”?","la gare","le stade","la plage","le magasin"],["How do you ask “Where is the park?”","Où est le parc ?","Quand est le parc ?","Qui est le parc ?","Pourquoi est le parc ?"],["TYPE: straight ahead","tout droit"],["ORDER: Where is the station?","Où est la gare"]],speak:["Ask where the station, park and shop are.","Give directions using right, left and straight ahead.","Describe three places near your home."]},
 {m:2,t:"Essential verbs",intro:"Start building your own sentences with the verbs to be, to have, to go and to like.",notes:["<b>Être</b> means “to be”: je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont.","<b>Avoir</b> means “to have”: j’ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont.","Use <b>aller + infinitive</b> for a near-future plan: je vais jouer = I’m going to play."],tables:[{h:"Être · to be",head:["French","English"],rows:[["je suis","I am"],["tu es","you are"],["il / elle est","he / she is"],["nous sommes","we are"],["vous êtes","you are (polite/plural)"],["ils / elles sont","they are"]]}],vocab:[["être","to be"],["avoir","to have"],["aller","to go"],["faire","to do / make"],["aimer","to like / love"],["je suis","I am"],["j’ai","I have"],["je vais","I go / I’m going"],["je fais","I do / I make"],["j’aime","I like"],["je veux","I want"],["je peux","I can"],["et","and"],["mais","but"],["parce que","because"],["avec","with"]],phrases:[["Je suis irlandais / irlandaise.","I am Irish."],["J’aime jouer au football.","I like playing football."],["Je vais au parc.","I’m going to the park."],["Je veux apprendre le français.","I want to learn French."]],quiz:[["“Je suis” means…","I am","I have","I go","I do"],["Which means “to like”?","aimer","avoir","aller","faire"],["Complete: Je ___ au parc. (go)","vais","suis","ai","fais"],["TYPE: I have","j’ai"],["ORDER: I like playing football","J’aime jouer au football"]],speak:["Say three things about yourself using Je suis…","Say two things you like using J’aime…","Make a plan using Je vais + a place or action."]},
 {m:2,t:"Free time, sport and games",intro:"Talk about hobbies, sport and video games with friends.",notes:["<b>J’aime + infinitive</b> lets you say which activities you like.","Use <b>jouer à</b> for many games and sports: jouer au football, jouer aux jeux vidéo.","Add <b>souvent</b> (often), <b>parfois</b> (sometimes) or <b>jamais</b> (never) to say how often."],vocab:[["le football","football / soccer"],["le match","match"],["l’équipe","team"],["le joueur","player"],["gagner","to win"],["perdre","to lose"],["s’entraîner","to train / practise"],["les jeux vidéo","video games"],["jouer","to play"],["la musique","music"],["écouter","to listen"],["lire","to read"],["regarder","to watch"],["les amis","friends"],["souvent","often"],["parfois","sometimes"],["le week-end","weekend"]],phrases:[["J’aime jouer au football.","I like playing football."],["Mon équipe a gagné.","My team won."],["Je joue aux jeux vidéo avec mes amis.","I play video games with my friends."],["Le week-end, j’écoute de la musique.","At the weekend, I listen to music."]],quiz:[["“Gagner” means…","to win","to lose","to play","to watch"],["Which means “video games”?","les jeux vidéo","les amis","la musique","le match"],["How do you say “sometimes”?","parfois","toujours","jamais","demain"],["TYPE: to play","jouer"],["ORDER: I play video games with my friends","Je joue aux jeux vidéo avec mes amis"]],speak:["Talk about your favourite sport or team.","Describe what you do at the weekend.","Say which games or music you enjoy."]},
 {m:3,t:"Describing people and things",intro:"Describe people, places and objects with simple adjectives.",notes:["Many adjectives change to agree with the noun: petit/petite, grand/grande.","<b>Très</b> means “very”; <b>assez</b> means “quite”.","<b>C’est</b> is a useful way to say “it is” or “that is”."],vocab:[["grand / grande","tall / big"],["petit / petite","small / short"],["sympa","nice / friendly"],["drôle","funny"],["gentil / gentille","kind"],["rapide","fast"],["lent / lente","slow"],["beau / belle","beautiful"],["nouveau / nouvelle","new"],["facile","easy"],["difficile","difficult"],["fatigué / fatiguée","tired"],["heureux / heureuse","happy"],["froid","cold"],["chaud","hot"],["il fait beau","the weather is nice"]],phrases:[["Mon ami est drôle et sympa.","My friend is funny and friendly."],["Le devoir est difficile.","The homework is difficult."],["Il fait froid aujourd’hui.","It’s cold today."],["C’est une très bonne idée !","That’s a very good idea!"]],quiz:[["“Drôle” means…","funny","cold","slow","new"],["Which means “tired”?","fatigué / fatiguée","heureux / heureuse","beau / belle","gentil / gentille"],["“Il fait froid” means…","It is cold","It is hot","It is sunny","It is late"],["TYPE: new (feminine)","nouvelle"],["ORDER: My friend is funny and friendly","Mon ami est drôle et sympa"]],speak:["Describe your best friend using three adjectives.","Describe the weather today.","Describe an object in your room."]},
 {m:3,t:"Yesterday and tomorrow",intro:"Talk about a recent day and a simple plan for tomorrow.",notes:["For many completed past actions, French uses <b>avoir + past participle</b>: j’ai joué (I played).","For plans, <b>aller + infinitive</b> is very useful: je vais étudier (I’m going to study).","Learn each phrase as a whole, then swap in other activities."],vocab:[["hier","yesterday"],["aujourd’hui","today"],["demain","tomorrow"],["la semaine dernière","last week"],["le week-end dernier","last weekend"],["j’ai joué","I played"],["j’ai mangé","I ate"],["j’ai regardé","I watched"],["j’ai fait","I did"],["je suis allé / allée","I went"],["je vais jouer","I’m going to play"],["je vais étudier","I’m going to study"],["bientôt","soon"],["plus tard","later"]],phrases:[["Hier, j’ai joué au football.","Yesterday, I played football."],["J’ai mangé une pizza.","I ate a pizza."],["Demain, je vais étudier.","Tomorrow, I’m going to study."],["Ce week-end, je vais voir mes amis.","This weekend, I’m going to see my friends."]],quiz:[["“Hier” means…","yesterday","tomorrow","today","later"],["How do you say “I played”?","j’ai joué","je vais jouer","je joue","j’ai jouer"],["“Je vais étudier” means…","I’m going to study","I studied","I like studying","I am a student"],["TYPE: tomorrow","demain"],["ORDER: Yesterday I played football","Hier j’ai joué au football"]],speak:["Say two things you did yesterday.","Say two plans for tomorrow or the weekend.","Ask someone Qu’est-ce que tu as fait hier ?"]},
 {m:3,t:"Final conversation",mode:"final-multi",intro:"Bring your French together: introduce yourself, talk about your interests and ask questions.",notes:["You don't need perfect sentences. Keep talking and use the words you know.","If you get stuck, say <b>Vous pouvez répéter, s’il vous plaît ?</b> (Can you repeat, please?)","Aim to understand the question and answer in one or two sentences."],vocab:[["pardon ?","sorry? / pardon?"],["je ne comprends pas","I don't understand"],["vous pouvez répéter ?","can you repeat? (polite)"],["plus lentement, s’il vous plaît","more slowly, please"],["comment dit-on… ?","how do you say…?"],["je ne sais pas","I don't know"],["à mon avis","in my opinion"],["je pense que…","I think that…"]],phrases:[["Je m’appelle… et je suis d’Irlande.","My name is… and I’m from Ireland."],["Pendant mon temps libre, j’aime…","In my free time, I like…"],["Hier, j’ai… et demain, je vais…","Yesterday I… and tomorrow I’m going to…"]],quiz:[["How do you ask someone to repeat?","Vous pouvez répéter ?","Vous pouvez manger ?","Vous pouvez jouer ?","Vous pouvez dormir ?"],["“Je ne comprends pas” means…","I don't understand","I don't know","I don't like it","I am ready"],["Which means “in my opinion”?","à mon avis","à bientôt","au revoir","à gauche"],["TYPE: I don't know","je ne sais pas"]],cando:["I can introduce myself and my family","I can use numbers and talk about my age","I can talk about school, food and hobbies","I can ask for and give directions","I can describe people and the weather","I can talk about yesterday and tomorrow","I can ask someone to repeat","I can keep a short conversation going"],convo:["Comment tu t’appelles et d’où viens-tu ?","Quel âge as-tu ?","Qu’est-ce que tu aimes faire ?","Qu’est-ce que tu as fait hier ?","Qu’est-ce que tu vas faire demain ?","Quel sport ou jeu préfères-tu ?","Comment est ton meilleur ami ?","Quel est ton plat préféré ?"],speak:["Introduce yourself and describe your interests.","Talk about yesterday and tomorrow.","Ask at least five questions and react to the answers.","Try a three-minute conversation without switching to English."]}
]},

 {n:1,t:"Build the basics",d:"Weeks 1–4",i:"Greetings, numbers, family and school. Start making simple Italian sentences."},

],lessons:[
 {m:1,t:"Greetings and introductions",intro:"Learn to greet someone, introduce yourself and say where you are from.",notes:["Use <b>mi chiamo</b> to say your name and <b>sono di…</b> to say where you are from.","<b>Tu</b> is informal. <b>Lei</b> is the polite form when speaking to someone you don't know well.","Italian pronunciation is regular: pronounce each vowel clearly."],vocab:[["ciao","hello / bye (informal)"],["buongiorno","hello / good morning"],["buonasera","good evening"],["arrivederci","goodbye"],["a presto","see you soon"],["grazie","thank you"],["per favore","please"],["prego","you're welcome"],["mi chiamo…","my name is…"],["come ti chiami?","what's your name?"],["sono di…","I'm from…"],["piacere","nice to meet you"],["come stai?","how are you?"],["sto bene, grazie","I'm fine, thanks"],["e tu?","and you?"]],phrases:[["Ciao! Mi chiamo Alex.","Hi! My name is Alex."],["Come ti chiami?","What's your name?"],["Vengo dall’Irlanda.","I'm from Ireland."],["Piacere! Come stai?","Nice to meet you! How are you?"],["Sto bene, grazie. E tu?","I'm fine, thanks. And you?"]],quiz:[["How do you say “hello” in Italian?","ciao","grazie","arrivederci","prego"],["“Mi chiamo Alex” means…","My name is Alex","I'm from Alex","I'm fine, Alex","Goodbye, Alex"],["Which means “thank you”?","grazie","prego","ciao","per favore"],["TYPE: Write “goodbye” in Italian","arrivederci"],["ORDER: I am from Ireland","Vengo dall’Irlanda"]],speak:["Introduce yourself using Mi chiamo…","Say where you are from using Sono di…","Greet someone and ask Come stai ?"]},
 {m:1,t:"Numbers and age",intro:"Learn useful numbers and how to say how old you are.",notes:["Italian numbers are mostly built by joining tens and units: ventidue (22), trentacinque (35).","Age uses <b>avere</b> (to have): <b>Ho dodici anni</b> means “I am twelve years old”.","Some numbers drop the final vowel before uno and otto: ventuno, ventotto."],vocab:[["zero","zero"],["uno","one"],["due","two"],["tre","three"],["quattro","four"],["cinque","five"],["sei","six"],["sette","seven"],["otto","eight"],["nove","nine"],["dieci","ten"],["undici","eleven"],["dodici","twelve"],["tredici","thirteen"],["quattordici","fourteen"],["quindici","fifteen"],["sedici","sixteen"],["venti","twenty"],["trenta","thirty"],["quaranta","forty"],["cinquanta","fifty"],["cento","one hundred"],["ho … anni","I am … years old"]],phrases:[["Ho dodici anni.","I am twelve years old."],["Ci sono tre persone.","There are three people."],["Costa dieci euro.","It costs ten euros."]],quiz:[["What number is “otto”?","8","6","9","10"],["How do you say “twelve”?","dodici","tredici","due","dieci"],["“Ho dodici anni” means…","I am twelve years old","I have twelve books","I am twelve people","I want twelve"],["TYPE: Write “five” in Italian","cinque"],["ORDER: It costs ten euros","Costa dieci euro"]],speak:["Count from zero to twenty in Italian.","Say your age using Ho … anni.","Say three prices using euro."]},
 {m:1,t:"Family and friends",intro:"Talk about your family, friends and pets.",notes:["Italian nouns are usually masculine or feminine: <b>il</b> is masculine and <b>la</b> is feminine.","Use <b>mio/mia/miei/mie</b> for “my”; the form changes to agree with the noun.","Use <b>ho</b> to say you have someone or something."],vocab:[["la famiglia","family"],["la madre","mother / mum"],["il padre","father / dad"],["i genitori","parents"],["il fratello","brother"],["la sorella","sister"],["la nonna","grandmother"],["il nonno","grandfather"],["la zia","aunt"],["lo zio","uncle"],["il cugino","male cousin"],["la cugina","female cousin"],["l’amico / l’amica","friend"],["il cane","dog"],["il gatto","cat"],["mio / mia / miei / mie","my"]],phrases:[["Ho un fratello.","I have a brother."],["La mia famiglia è simpatica.","My family is nice."],["Il mio amico si chiama Luca.","My friend is called Luca."],["Ho un cane e un gatto.","I have a dog and a cat."]],quiz:[["Which means “mother”?","la madre","il padre","la sorella","la zia"],["“Il cane” is…","the dog","the cat","the horse","the bird"],["How do you say “my family”?","la mia famiglia","il mio famiglia","i mia famiglia","la famiglia mia"],["TYPE: I have a brother","ho un fratello"],["ORDER: My friend is called Luca","Il mio amico si chiama Luca"]],speak:["Describe who is in your family.","Say whether you have brothers, sisters or pets.","Introduce a friend in two Italian sentences."]},
 {m:1,t:"At school",intro:"Learn words for school, lessons and things in your school bag.",notes:["<b>Mi piace</b> is used for something you like in the singular; <b>mi piacciono</b> for plural things.","Adjectives often come after the noun: un libro interessante.","Italian subject names are generally written in lowercase."],vocab:[["la scuola","school"],["la classe","classroom / class"],["l’insegnante","teacher"],["lo studente / la studentessa","student"],["il libro","book"],["il quaderno","notebook"],["la penna","pen"],["lo zaino","backpack"],["i compiti","homework"],["l’esame","exam"],["la matematica","maths"],["l’inglese","English"],["la storia","history"],["le scienze","science"],["lo sport","sport"],["facile","easy"],["difficile","difficult"],["divertente","fun"]],phrases:[["Mi piace la matematica.","I like maths."],["I compiti sono difficili.","The homework is difficult."],["Ho un esame lunedì.","I have an exam on Monday."],["La mia materia preferita è lo sport.","My favourite subject is PE."]],quiz:[["“Il quaderno” means…","notebook","backpack","teacher","exam"],["How do you say “I like maths”?","Mi piace la matematica","Sono la matematica","Ho la matematica","Mi piacciono la matematica"],["Which means “homework”?","i compiti","le scienze","la penna","la scuola"],["TYPE: book","libro"],["ORDER: I have an exam on Monday","Ho un esame lunedì"]],speak:["Say three subjects you study.","Describe what is in your school bag.","Give one subject you like and one you don't like."]},
 {m:2,t:"Food and drink",intro:"Order a snack, name foods and say what you like to eat or drink.",notes:["<b>Vorrei…</b> is a polite way to order something: “I would like…”.","Use <b>ho fame</b> for “I’m hungry” and <b>ho sete</b> for “I’m thirsty”.","Use <b>per favore</b> to say please."],vocab:[["l’acqua","water"],["il latte","milk"],["il succo","juice"],["il pane","bread"],["il formaggio","cheese"],["il pollo","chicken"],["il pesce","fish"],["il riso","rice"],["le patate","potatoes"],["la mela","apple"],["la banana","banana"],["la fragola","strawberry"],["l’insalata","salad"],["la pizza","pizza"],["il gelato","ice cream"],["la colazione","breakfast"],["il pranzo","lunch"],["la cena","dinner"],["ho fame","I’m hungry"],["ho sete","I’m thirsty"],["vorrei…","I would like…"]],phrases:[["Vorrei un succo, per favore.","I would like a juice, please."],["Mi piace la pizza.","I like pizza."],["Non mi piace il pesce.","I don't like fish."],["Il conto, per favore.","The bill, please."]],quiz:[["“Il pane” means…","bread","cheese","rice","fish"],["How do you say “I’m thirsty”?","Ho sete","Sono sete","Ho fame","Voglio sete"],["Which is a fruit?","la fragola","il pollo","il riso","il formaggio"],["TYPE: water","acqua"],["ORDER: I would like a juice, please","Vorrei un succo per favore"]],speak:["Order a drink politely.","Name five foods you enjoy.","Say what you usually eat for breakfast."]},
 {m:2,t:"Days, dates and time",intro:"Use days, months and clock times to talk about your plans.",notes:["Days and months are written in lowercase in Italian.","Use <b>È l’una</b> for one o’clock and <b>Sono le due</b> for two o’clock.","<b>e un quarto</b> means quarter past; <b>e mezza</b> means half past."],vocab:[["lunedì","Monday"],["martedì","Tuesday"],["mercoledì","Wednesday"],["giovedì","Thursday"],["venerdì","Friday"],["sabato","Saturday"],["domenica","Sunday"],["gennaio","January"],["febbraio","February"],["marzo","March"],["aprile","April"],["maggio","May"],["giugno","June"],["luglio","July"],["agosto","August"],["settembre","September"],["ottobre","October"],["novembre","November"],["dicembre","December"],["oggi","today"],["domani","tomorrow"],["ieri","yesterday"],["Che ore sono?","What time is it?"]],phrases:[["Oggi è venerdì.","Today is Friday."],["Il mio compleanno è a maggio.","My birthday is in May."],["Sono le otto e mezza.","It is half past eight."],["La partita è sabato.","The match is on Saturday."]],quiz:[["“Domani” means…","tomorrow","yesterday","today","Monday"],["Which means “Friday”?","venerdì","giovedì","sabato","martedì"],["“Sono le otto” is…","8 o’clock","2 o’clock","half past eight","quarter past eight"],["TYPE: Monday","lunedì"],["ORDER: Today is Friday","Oggi è venerdì"]],speak:["Say the days of the week in Italian.","Say what day your next match or activity is on.","Tell the time at three different points in your day."]},
 {m:2,t:"Places and directions",intro:"Find your way around a town and ask where places are.",notes:["Ask <b>Dov’è…?</b> to mean “Where is…?”","<b>A destra</b> means right, <b>a sinistra</b> means left and <b>sempre dritto</b> means straight ahead.","<b>C’è</b> means “there is”; <b>ci sono</b> means “there are”."],vocab:[["la casa","house"],["la strada","street"],["il negozio","shop"],["il supermercato","supermarket"],["il parco","park"],["lo stadio","stadium"],["la stazione","station"],["l’ospedale","hospital"],["la spiaggia","beach"],["il cinema","cinema"],["il ristorante","restaurant"],["il bagno","toilet / bathroom"],["Dov’è…?","Where is…?"],["a destra","to the right"],["a sinistra","to the left"],["sempre dritto","straight ahead"],["vicino a","near"],["lontano da","far from"],["accanto a","next to"]],phrases:[["Dov’è la stazione?","Where is the station?"],["Vai sempre dritto.","Go straight ahead."],["Gira a sinistra.","Turn left."],["Lo stadio è vicino al parco.","The stadium is near the park."]],quiz:[["“A sinistra” means…","to the left","to the right","straight ahead","far away"],["Which means “station”?","la stazione","lo stadio","la spiaggia","il negozio"],["How do you ask “Where is the park?”","Dov’è il parco?","Quando è il parco?","Chi è il parco?","Perché è il parco?"],["TYPE: straight ahead","sempre dritto"],["ORDER: Where is the station?","Dov’è la stazione"]],speak:["Ask where the station, park and shop are.","Give directions using right, left and straight ahead.","Describe three places near your home."]},
 {m:2,t:"Essential verbs",intro:"Start building your own sentences with the verbs to be, to have, to go and to like.",notes:["<b>Essere</b> means “to be”: io sono, tu sei, lui/lei è, noi siamo, voi siete, loro sono.","<b>Avere</b> means “to have”: io ho, tu hai, lui/lei ha, noi abbiamo, voi avete, loro hanno.","Use <b>andare a + infinitive</b> for a plan: vado a giocare = I’m going to play."],tables:[{h:"Essere · to be",head:["Italian","English"],rows:[["io sono","I am"],["tu sei","you are"],["lui / lei è","he / she is"],["noi siamo","we are"],["voi siete","you are (plural)"],["loro sono","they are"]]}],vocab:[["essere","to be"],["avere","to have"],["andare","to go"],["fare","to do / make"],["piacere","to like"],["sono","I am"],["ho","I have"],["vado","I go / I’m going"],["faccio","I do / I make"],["mi piace","I like"],["voglio","I want"],["posso","I can"],["e","and"],["ma","but"],["perché","because"],["con","with"]],phrases:[["Sono irlandese.","I am Irish."],["Mi piace giocare a calcio.","I like playing football."],["Vado al parco.","I’m going to the park."],["Voglio imparare l’italiano.","I want to learn Italian."]],quiz:[["“Sono” means…","I am","I have","I go","I do"],["Which means “to go”?","andare","avere","essere","fare"],["Complete: Io ___ al parco. (go)","vado","sono","ho","faccio"],["TYPE: I have","ho"],["ORDER: I like playing football","Mi piace giocare a calcio"]],speak:["Say three things about yourself using Sono…","Say two things you like using Mi piace…","Make a plan using Vado a… or Domani voglio…"]},
 {m:2,t:"Free time, sport and video games",intro:"Talk about hobbies, sport and video games with friends.",notes:["Use <b>mi piace + infinitive</b> to say which activities you like.","In Italian, you can say <b>giocare a calcio</b> for playing football and <b>giocare ai videogiochi</b> for playing video games.","Add <b>spesso</b> (often), <b>a volte</b> (sometimes) or <b>mai</b> (never) to say how often."],vocab:[["il calcio","football / soccer"],["la partita","match"],["la squadra","team"],["il giocatore","player"],["vincere","to win"],["perdere","to lose"],["allenarsi","to train / practise"],["i videogiochi","video games"],["giocare","to play"],["la musica","music"],["ascoltare","to listen"],["leggere","to read"],["guardare","to watch"],["gli amici","friends"],["spesso","often"],["a volte","sometimes"],["il fine settimana","weekend"]],phrases:[["Mi piace giocare a calcio.","I like playing football."],["La mia squadra ha vinto.","My team won."],["Gioco ai videogiochi con i miei amici.","I play video games with my friends."],["Nel fine settimana ascolto musica.","At the weekend, I listen to music."]],quiz:[["“Vincere” means…","to win","to lose","to play","to watch"],["Which means “video games”?","i videogiochi","gli amici","la musica","la partita"],["How do you say “sometimes”?","a volte","sempre","mai","domani"],["TYPE: to play","giocare"],["ORDER: I play video games with my friends","Gioco ai videogiochi con i miei amici"]],speak:["Talk about your favourite sport or team.","Describe what you do at the weekend.","Say which games or music you enjoy."]},
 {m:3,t:"Describing people and things",intro:"Describe people, places and objects with simple adjectives.",notes:["Many adjectives change their endings to agree: alto/alta, simpatico/simpatica.","<b>Molto</b> means “very” and <b>abbastanza</b> means “quite”.","<b>È…</b> is a useful way to say “he/she/it is…”."],vocab:[["alto / alta","tall"],["piccolo / piccola","small"],["simpatico / simpatica","nice / friendly"],["divertente","funny / fun"],["gentile","kind"],["veloce","fast"],["lento / lenta","slow"],["bello / bella","beautiful"],["nuovo / nuova","new"],["facile","easy"],["difficile","difficult"],["stanco / stanca","tired"],["felice","happy"],["freddo","cold"],["caldo","hot"],["c’è il sole","it is sunny"]],phrases:[["Il mio amico è divertente e simpatico.","My friend is funny and friendly."],["I compiti sono difficili.","The homework is difficult."],["Oggi fa freddo.","It’s cold today."],["È un’ottima idea!","That’s a great idea!"]],quiz:[["“Veloce” means…","fast","cold","slow","new"],["Which means “tired”?","stanco / stanca","felice","bello / bella","gentile"],["“Oggi fa freddo” means…","It is cold today","It is hot today","It is sunny today","It is late today"],["TYPE: new (feminine)","nuova"],["ORDER: My friend is funny and friendly","Il mio amico è divertente e simpatico"]],speak:["Describe your best friend using three adjectives.","Describe the weather today.","Describe an object in your room."]},
 {m:3,t:"Yesterday and tomorrow",intro:"Talk about a recent day and a simple plan for tomorrow.",notes:["For many completed past actions, Italian uses <b>avere + past participle</b>: ho giocato (I played).","For a plan, <b>andare a + infinitive</b> can be useful: vado a studiare (I’m going to study).","Learn each phrase as a whole, then swap in other activities."],vocab:[["ieri","yesterday"],["oggi","today"],["domani","tomorrow"],["la settimana scorsa","last week"],["lo scorso fine settimana","last weekend"],["ho giocato","I played"],["ho mangiato","I ate"],["ho guardato","I watched"],["ho fatto","I did"],["sono andato / andata","I went"],["vado a giocare","I’m going to play"],["vado a studiare","I’m going to study"],["presto","soon"],["più tardi","later"]],phrases:[["Ieri ho giocato a calcio.","Yesterday, I played football."],["Ho mangiato una pizza.","I ate a pizza."],["Domani vado a studiare.","Tomorrow, I’m going to study."],["Questo fine settimana vedo i miei amici.","This weekend, I’m seeing my friends."]],quiz:[["“Ieri” means…","yesterday","tomorrow","today","later"],["How do you say “I played”?","ho giocato","vado a giocare","gioco","ho giocare"],["“Domani vado a studiare” means…","Tomorrow I’m going to study","I studied yesterday","I like studying","I am a student"],["TYPE: tomorrow","domani"],["ORDER: Yesterday I played football","Ieri ho giocato a calcio"]],speak:["Say two things you did yesterday.","Say two plans for tomorrow or the weekend.","Ask someone Che cosa hai fatto ieri ?"]},
 {m:3,t:"Final conversation",mode:"final-multi",intro:"Bring your Italian together: introduce yourself, talk about your interests and ask questions.",notes:["You don't need perfect sentences. Keep talking and use the words you know.","If you get stuck, say <b>Puoi ripetere, per favore?</b> (Can you repeat, please?)","Aim to understand the question and answer in one or two sentences."],vocab:[["scusa?","sorry? / excuse me?"],["non capisco","I don't understand"],["puoi ripetere?","can you repeat?"],["più lentamente, per favore","more slowly, please"],["come si dice…?","how do you say…?"],["non lo so","I don't know"],["secondo me","in my opinion"],["penso che…","I think that…"]],phrases:[["Mi chiamo… e sono irlandese.","My name is… and I’m Irish."],["Nel tempo libero mi piace…","In my free time, I like…"],["Ieri ho… e domani…","Yesterday I… and tomorrow…"]],quiz:[["How do you ask someone to repeat?","Puoi ripetere?","Puoi mangiare?","Puoi giocare?","Puoi dormire?"],["“Non capisco” means…","I don't understand","I don't know","I don't like it","I am ready"],["Which means “in my opinion”?","secondo me","a presto","arrivederci","a sinistra"],["TYPE: I don't know","non lo so"]],cando:["I can introduce myself and my family","I can use numbers and talk about my age","I can talk about school, food and hobbies","I can ask for and give directions","I can describe people and the weather","I can talk about yesterday and tomorrow","I can ask someone to repeat","I can keep a short conversation going"],convo:["Come ti chiami e di dove sei?","Quanti anni hai?","Che cosa ti piace fare?","Che cosa hai fatto ieri?","Che cosa fai domani?","Qual è il tuo sport o gioco preferito?","Com’è il tuo migliore amico?","Qual è il tuo piatto preferito?"],speak:["Introduce yourself and describe your interests.","Talk about yesterday and tomorrow.","Ask at least five questions and react to the answers.","Try a three-minute conversation without switching to English."]}
]}

/* ---------- quiz building ---------- */
function mkQ(it){
  const q=it[0],a=it[1];
  if(q.startsWith('TYPE:'))return{k:'type',q:q.slice(5).trim(),a:a.split('|')};
  if(q.startsWith('ORDER:'))return{k:'order',q:q.slice(6).trim(),a,pool:null,ans:[]};
  return{k:'mc',q,a,o:shuffle([a].concat(it.slice(2)))};
}
function vocabQs(list,n,pool){
  return shuffle(list).slice(0,n).map(v=>{
    const toEn=Math.random()<.5,f=toEn?1:0,c=v[f];
    const others=[...new Set(shuffle(pool).filter(x=>x[f]!==c&&x[0]!==v[0]).map(x=>x[f]))].slice(0,3);
    return{k:'mc',q:toEn?`What does “${v[0]}” mean?`:`How do you say “${v[1]}” in ${languageName()}?`,a:c,o:shuffle([c].concat(others))};
  });
}
function buildQuiz(l){
  let items;
  if(l.mode==='challenge'){items=vocabQs(ALLV.filter(v=>v[2]<28),20,ALLV);}
  else if(l.mode==='final'||l.mode==='final-multi'){
    const hw=[];LESSONS.forEach(x=>(x.quiz||[]).forEach(q=>hw.push(q)));
    items=shuffle(hw).slice(0,12).map(mkQ).concat(vocabQs(ALLV,4,ALLV));items=shuffle(items);
  }else{
    const v=l.vocab||[];
    items=shuffle(l.quiz.map(mkQ).concat(vocabQs(v,Math.min(4,v.length),v.length>=6?v:ALLV)));
  }
  return{lesson:l.id,items,i:0,score:0,state:'ask',picked:null,res:null,missed:[],xp:0,lv0:levelOf(P.xp)};
}

const TY={1:['pic','es2en','es2en','pic'],2:['es2en','en2es','listen','pic','en2es'],3:['en2es','typeEs','listen','typeEs','es2en'],4:['typeEs','typeEs','listenType','en2es','listen'],5:['typeEs','typeEs','listenType','en2es'],6:['typeEs','listenType','typeEs','listenType','en2es'],7:['typeEs','listenType']};
const PH={1:['es2en'],2:['es2en','en2es','listen'],3:['en2es','gap','order','listen'],4:['order','gap','typeEs','listenType'],5:['typeEs','order','listenType','gap']};
const PR={pick:null,s:null};
const poolCache={};
function poolOf(T){

/* ----- question generation ----- */
function near(T,pool,it,f,m){
  if(T.num){
    const b=+it.en,offs=shuffle([-10,-9,-5,-3,-2,-1,1,2,3,5,9,10,11,20,-20].concat(b>=100?[-100,100,-200,200,-50,50]:[]).concat(b>=1000?[-1000,1000,-2000]:[])),out=[];
    for(const o of offs){const n=b+o;if(n<0||n===b)continue;out.push(f==='en'?String(n):numToTarget(n));if(out.length>=m)break;}
    return out;
  }
  const seen=new Set([it[f]]),out=[];
  for(const x of shuffle(pool)){const v=x[f];if(!v||seen.has(v))continue;seen.add(v);out.push(v);if(out.length>=m)break;}
  return out;
}
function pickType(T,lv){
  const list=T.phr?PH[Math.min(lv,5)]:TY[Math.min(lv,7)];
  let t=list[Math.floor(Math.random()*list.length)];

  return t;
}
function makeQ(T,it,lv,pool,retry){
  let t=pickType(T,lv);

  if((t==='gap'||t==='order')&&!T.phr)t='typeEs';
  const K=lv===1?3:lv>=5?5:4;
  const q={t,it,retry:!!retry,lv,state:'ask',played:false};
  const mc=(f,prompt)=>{q.prompt=prompt;q.ans=it[f];q.opts=shuffle([it[f]].concat(near(T,pool,it,f,K-1)));};
  if(t==='es2en')mc('en',T.num?'Which number is this?':T.phr?'Choose the translation':'What does this mean?');
  else if(t==='en2es')mc('es',T.num?`Choose the ${languageName()} for this number`:T.phr?`Choose the ${languageName()}`:`How do you say this in ${languageName()}?`);
  else if(t==='pic'){q.prompt=`Which one is “${it.es}”?`;q.ans=it.ic;q.opts=shuffle([it.ic].concat(near(T,pool.filter(x=>x.ic),it,'ic',K-1)));}

  else if(t==='typeEs'){q.prompt=T.num?`Write this number in ${languageName()}`:`Write this in ${languageName()}`;q.exp=it.es;}
  else if(t==='listenType'){q.prompt='Type what you hear';q.exp=T.num?it.en:it.es;q.digits=!!T.num;}
  else if(t==='gap'){

    const others=[];pool.forEach(p=>p.es.split(' ').forEach(w=>{w=w.replace(/[¿?¡!.,]/g,'');if(w.length>=3&&w.toLowerCase()!==word.toLowerCase())others.push(w);}));

}
function startSession(T){

/* ----- answering ----- */
function eqEs(val,ans){
  const cv=clean(val),ca=clean(ans);
  if(cv===ca)return{ok:true};
  const lv=strip(cv),la=strip(ca);
  if(lv===la)return{ok:true,note:'Watch the accents: '+ans};
  const ART=/^(de la|de l’|de l\'|el|la|los|las|un|una|unos|unas|le|les|un|une|des|du|il|lo|i|gli|uno|una)\s+/,na=la.replace(ART,''),nv=lv.replace(ART,'');

  return{ok:false};
}
function finishAnswer(ok,note){
  const s=PR.s,q=s.qs[s.i];
  q.state='fb';q.ok=ok;q.note=note||'';feedbackSound(ok);
  const st=P.topics[s.T.id]||(P.topics[s.T.id]={c:0,a:0});
  if(!q.retry){st.a++;if(ok)st.c++;}
  if(ok){s.streak++;s.best=Math.max(s.best,s.streak);if(!q.retry){s.correct++;s.gained+=XP_PER;P.xp+=XP_PER;}}
  else{s.streak=0;if(s.retries<3){s.retries++;s.qs.push(makeQ(s.T,q.it,s.lv,s.pool,true));}}
  save();paint();
}

  const T=PR.s.T,it=q.it;
  const say1=(hasTTS||activeLanguage==='ga')?`<button class="say" data-act="say" data-say="${esc(it.es)}" aria-label="Listen">${ICON}</button>`:'';
  const listen=(hasTTS||activeLanguage==='ga')?`<div class="lbtns"><button class="bigsay" data-act="say" data-say="${esc(it.es)}">${ICON}<span>Listen</span></button><button class="btn small" data-act="slow" data-say="${esc(it.es)}">Slow</button></div>`:'';
  switch(q.t){
    case 'es2en':return `<div class="qbig"><span class="qw">${esc(it.es)}</span>${say1}</div>`;
    case 'en2es':return `<div class="qbig"><span class="qw">${esc(it.en)}</span></div>`;
    case 'pic':return `<div class="qbig"><span class="qw">${esc(it.es)}</span>${say1}</div>`;
    case 'listen':case 'listenType':return `<div class="qbig">${listen}</div>`;
    case 'typeEs':return `<div class="qbig"><span class="qw">${esc(it.en)}</span></div>`;
    case 'gap':return `<div class="qbig col"><span class="qw sm">${esc(q.sentence)}</span><span class="hint">${esc(it.en)}</span></div>`;
    case 'order':return `<div class="qbig"><span class="qw sm">${esc(it.en)}</span></div>`;
  }
  return '';
}
function sessionHTML(){
  const s=PR.s;
  if(s.state==='done')return summaryHTML(s);
  const q=s.qs[s.i],n=s.qs.length,fb=q.state==='fb';
  let body='';
  if(q.opts){
    if(q.t==='pic')body=`<div class="tiles">${q.opts.map((o,i)=>{let c='';if(fb){if(o===q.ans)c=' ok';else if(i===q.picked)c=' no';}if(!fb&&q.picked===i)c=' selected';return `<button class="tile${c}" data-act="pr-pick" data-i="${i}"${fb?' disabled':''} aria-label="Option ${i+1}" aria-pressed="${q.picked===i}">${icon(o)}</button>`;}).join('')}</div>`;
    else body=`<div class="opts">${q.opts.map((o,i)=>{let c='',m='';if(fb){if(o===q.ans){c=' ok';m='✓';}else if(i===q.picked){c=' no';m='✗';}}else if(q.picked===i)c=' selected';return `<button class="opt${c}" data-act="pr-pick" data-i="${i}"${fb?' disabled':''} aria-pressed="${q.picked===i}"><span>${esc(o)}</span><span class="mark2">${m}</span></button>`;}).join('')}</div>`;
  }else if(q.t==='order'){
    const chips=(arr,a)=>arr.map(x=>`<button class="chip" data-act="${a}" data-id="${x.id}"${fb?' disabled':''}>${esc(x.w)}</button>`).join('');
    body=`<div class="tray ans">${chips(q.sel,'pr-orda')||'<span class="hint">Tap the words in order</span>'}</div><div class="tray">${chips(q.pool,'pr-ordp')}</div>`;
  }else{
    body=`<div class="inrow"><input type="text" id="pr-ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.digits?'Type the number':`Type in ${languageName()}`}"${fb?` value="${esc(q.typed||'')}" disabled`:''}></div>`;
  }
  let ansTxt='';
  if(!q.ok){
    ansTxt=({es2en:q.it.en,listen:q.it.en,en2es:q.it.es,typeEs:q.it.es,listenType:q.digits?q.it.en+' ('+q.it.es+')':q.it.es,order:q.it.es,gap:q.it.es,pic:q.it.es+' = '+icon(q.it.ic)})[q.t];
  }
  const speakAns=(hasTTS||activeLanguage==='ga')&&q.t!=='order'?`<button class="say" data-act="say" data-say="${esc(q.it.es)}" aria-label="Listen">${ICON}</button>`:'';
  let bar='';
  if(fb)bar=`<div class="fbar ${q.ok?'ok':'no'}" role="status"><span class="feedback-emoji" aria-hidden="true">${q.ok?'👍':'👎'}</span><div class="fbt"><b>${q.ok?'Correct!'+(q.retry?'':' +'+XP_PER+' XP'):'Not quite'}</b>${q.ok&&q.note?`<span>${esc(q.note)}</span>`:''}${!q.ok?`<span>Answer: <b>${q.t==='pic'?esc(q.it.es)+' '+icon(q.it.ic):esc(ansTxt)}</b></span>`:''}</div>${speakAns}<button class="btn chunky" data-act="pr-next">${s.i+1<n?'Continue':'Finish'}</button></div>`;
  else if(q.opts)bar=`<div class="fbar"><span class="hint">${q.picked==null?'Choose an answer first.':'Ready to check your answer?'}</span><button class="btn primary chunky" data-act="pr-confirm"${q.picked==null?' disabled':''}>Confirm answer</button></div>`;
  else bar=`<div class="fbar"><span></span><button class="btn primary chunky" data-act="pr-check"${q.t==='order'&&!q.sel.length?' disabled':''}>Confirm answer</button></div>`;
  return `<div class="wrap sess"><div class="sbar"><button class="x" data-act="pr-quit" aria-label="Quit this lesson">✕</button><div class="bar"><i style="width:${s.i/n*100}%"></i></div><span class="sstreak" title="Correct in a row">🔥 ${s.streak}</span></div>
  <p class="qlabel">${esc(s.T.name)} · Level ${s.lv}${q.retry?' · second try':''}</p><h2 class="qprompt">${esc(q.prompt)}</h2>${qBig(q)}${body}${bar}</div>`;
}
function summaryHTML(s){
  const first=s.qs.filter(q=>!q.retry).length,acc=Math.round(s.correct/first*100),up=s.lv1>s.lv0;
  const{nxt,pct}=prInfo();
  return `<div class="wrap sess"><div class="card result"><p class="qlabel">${esc(s.T.name)} · lesson complete</p><div class="score">+${s.gained} XP</div>
  <p class="intro" style="margin-top:8px">${s.correct} of ${first} right first time (${acc}%). Best streak: ${s.best}.</p>
  <div class="bar" style="margin-top:14px"><i style="width:${pct}%"></i></div><p class="hint" style="margin-top:6px">${nxt?`${fmt(nxt.xp-P.xp)} XP to Level ${nxt.n}`:'Top level reached'}</p>
  ${up?`<div class="banner" style="margin-top:16px;--mc:var(--m1)"><h3>Level up! You are now Level ${s.lv1}: ${levelName(LEVELS[s.lv1-1])}</h3><p>${levelDesc(LEVELS[s.lv1-1])}</p></div>`:''}
  <div class="footer" style="margin-top:18px"><button class="btn primary chunky" data-act="pr-again">Practise again</button><button class="btn chunky" data-act="tab" data-v="practice">Choose another topic</button></div></div></div>`;
}
function prAfter(){
  const s=PR.s;if(!s||s.state==='done')return;const q=s.qs[s.i];
  const a=document.getElementById('pr-ans');if(a&&!a.disabled)a.focus({preventScroll:true});
  if((q.t==='listen'||q.t==='listenType')&&!q.played&&q.state==='ask'){q.played=true;setTimeout(()=>say(q.it.es,.85),150);}
}
function prClick(a,t){
  switch(a){
    case 'pr-start':startSession(TOPICS.find(x=>x.id===t.dataset.id));return true;
    case 'pr-again':startSession(PR.s.T);return true;
    case 'pr-quit':S.view='practice';paint(true);return true;
    case 'pr-pick':{const s=PR.s,q=s.qs[s.i];if(q.state!=='ask')return true;q.picked=+t.dataset.i;paint();return true;}
    case 'pr-confirm':{const s=PR.s,q=s.qs[s.i];if(q.state!=='ask'||q.picked==null)return true;finishAnswer(q.opts[q.picked]===q.ans);return true;}
    case 'pr-check':prCheck();return true;
    case 'pr-next':prNext();return true;
    case 'pr-ordp':{const q=PR.s.qs[PR.s.i],k=q.pool.findIndex(x=>x.id===+t.dataset.id);if(k>=0){q.sel.push(q.pool.splice(k,1)[0]);paint();}return true;}
    case 'pr-orda':{const q=PR.s.qs[PR.s.i],k=q.sel.findIndex(x=>x.id===+t.dataset.id);if(k>=0){q.pool.push(q.sel.splice(k,1)[0]);paint();}return true;}
    case 'slow':say(t.dataset.say,.55);return true;
  }
  return false;
}
function prChange(t){if(t.dataset.act==='lvsel'){PR.pick=+t.value;paint();return true;}return false;}
function prKey(e){
  if(S.view!=='session'||!PR.s||PR.s.state==='done')return false;
  const q=PR.s.qs[PR.s.i];
  if(e.key==='Enter'){
    if(q.state==='fb'){e.preventDefault();prNext();return true;}
    if(e.target.id==='pr-ans'){e.preventDefault();prCheck();return true;}
  }
  return false;
}

/* ---------- paint ---------- */
function paint(top){
  root.innerHTML=header()+(S.view==='practice'?practiceHTML():S.view==='session'?sessionHTML():S.view==='home'?homeHTML():S.view==='lesson'?lessonHTML():S.view==='cards'?cardsHTML():wordsHTML());
  if(top)window.scrollTo(0,0);
  if(S.view==='session')prAfter();
}
function paintPanel(){const p=document.getElementById('panel');if(p)p.innerHTML=panelHTML();else paint();const q=S.quiz;if(S.view==='lesson'&&S.step===1&&q&&q.state==='ask'&&q.items[q.i].k==='type'){const a=document.getElementById('ans');if(a)a.focus({preventScroll:true});}}
function openLesson(i,step){
  const l=L(i);S.view='lesson';S.idx=i;S.quiz=null;S.showEn=!(l.dialogue&&l.dialogue.hideEn);
  S.step=step!=null?step:(!learned(i)?0:!practised(i)?1:2);
  paint(true);
}
function refreshLesson(){paint();}

/* ---------- quiz logic ---------- */
function gainXP(Q){P.xp+=XP_PER;Q.xp=(Q.xp||0)+XP_PER;save();}
function answerQ(){
  const Q=S.quiz,it=Q.items[Q.i];let ok=false,note='';
  if(it.k==='type'){
    const el=document.getElementById('ans'),val=clean(el.value);Q.typed=el.value;
    if(!val)return;
    const ex=it.a.some(a=>clean(a)===val),lo=it.a.some(a=>strip(clean(a))===strip(val));
    ok=ex||lo;if(!ex&&lo)note='Correct, but watch the accents.';
  }else if(it.k==='order'){
    ok=clean(it.ans.map(x=>x.w).join(' '))===clean(it.a);
  }
  Q.res={ok,note};Q.state='fb';feedbackSound(ok);if(ok){Q.score++;gainXP(Q);}else Q.missed.push({q:it.q,a:it.k==='type'?it.a[0]:it.a});
  paintPanel();
}
function nextQ(){
  const Q=S.quiz;
  if(Q.i+1<Q.items.length){Q.i++;Q.state='ask';Q.picked=null;Q.res=null;Q.typed='';paintPanel();return;}
  Q.state='done';const pct=Math.round(Q.score/Q.items.length*100);
  P.practise[Q.lesson]=Math.max(P.practise[Q.lesson]||0,pct);markDay();save();
  paint();
}

function feedbackSound(ok){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=new AC();
  const tone=(freq,start,duration)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(freq,c.currentTime+start);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,c.currentTime+start);g.gain.exponentialRampToValueAtTime(.10,c.currentTime+start+.018);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+start+duration);o.start(c.currentTime+start);o.stop(c.currentTime+start+duration+.01);};
  if(ok){tone(520,0,.12);tone(780,.11,.15);}else{tone(290,0,.15);tone(190,.13,.17);}
  setTimeout(()=>{try{c.close();}catch(e){}},500);
 }catch(e){}
}
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(prClick(a,t))return;
  switch(a){
    case 'tab':if(t.tagName==='SELECT')return;S.view=t.dataset.v;paint(true);break;
    case 'theme':P.theme=P.theme==='system'?'light':P.theme==='light'?'dark':'system';save();applyTheme();paint();break;
    case 'language':activateLanguage(t.dataset.v);break;
    case 'open':openLesson(+t.dataset.id);break;
    case 'step':S.step=+t.dataset.v;paint();window.scrollTo(0,0);break;
    case 'learned':P.learn[L(S.idx).id]=1;markDay();save();S.step=1;paint(true);break;
    case 'startq':S.quiz=buildQuiz(L(S.idx));paint();break;
    case 'pick':{const Q=S.quiz;if(Q.state!=='ask')return;Q.picked=+t.dataset.i;paintPanel();break;}
    case 'confirm-pick':{const Q=S.quiz,it=Q.items[Q.i];if(Q.state!=='ask'||Q.picked==null)return;const ok=it.o[Q.picked]===it.a;Q.res={ok,note:''};Q.state='fb';if(ok){Q.score++;gainXP(Q);}else Q.missed.push({q:it.q,a:it.a});feedbackSound(ok);paintPanel();break;}
    case 'check':answerQ();break;
    case 'next':nextQ();break;
    case 'ordp':{const it=S.quiz.items[S.quiz.i],k=it.pool.findIndex(x=>x.id===+t.dataset.id);if(k>=0){it.ans.push(it.pool.splice(k,1)[0]);paintPanel();}break;}
    case 'orda':{const it=S.quiz.items[S.quiz.i],k=it.ans.findIndex(x=>x.id===+t.dataset.id);if(k>=0){it.pool.push(it.ans.splice(k,1)[0]);paintPanel();}break;}
    case 'ordreset':{const it=S.quiz.items[S.quiz.i];it.pool=shuffle(it.pool.concat(it.ans));it.ans=[];paintPanel();break;}
    case 'say':say(t.dataset.say);break;
    case 'speed':S.speed=+t.dataset.v;paintPanel();break;
    case 'play':{const l=L(S.idx);if(!(hasTTS||activeLanguage==='ga')||!l.dialogue)return;if(hasTTS)speechSynthesis.cancel();l.dialogue.lines.forEach(x=>say(x[1],S.speed,true));break;}
    case 'speakdone':P.speak[L(S.idx).id]=1;markDay();save();paint();break;
    case 'copydraft':{const ta=document.getElementById('draft');copyText(ta.value||'',t,ta);break;}
    case 'copytext':copyText(t.dataset.t,t);break;
    case 'dir':S.dir=t.dataset.v;if(S.fc)S.fc.flip=false;paint();break;
    case 'flip':if(S.fc&&S.fc.q.length){S.fc.flip=!S.fc.flip;paint();}break;
    case 'got':{const f=S.fc;f.q.shift();f.got++;f.flip=false;paint();break;}
    case 'again':{const f=S.fc;f.q.push(f.q.shift());f.again++;f.flip=false;paint();break;}
    case 'newsession':newSession();paint();break;
  }
});
function copyText(txt,btn,ta){
  const old=btn.textContent;
  const done=m=>{btn.textContent=m;setTimeout(()=>{btn.textContent=old;},1800);};
  try{navigator.clipboard.writeText(txt).then(()=>done('Copied'),()=>{if(ta)ta.select();done('Select and copy');});}catch(e){if(ta)ta.select();done('Select and copy');}
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(prChange(t))return;
  if(t.dataset.act==='language'){activateLanguage(t.value);return;}
  if(t.dataset.act==='deck'){S.deck=t.value;newSession();paint();}
  else if(t.dataset.act==='showen'){S.showEn=t.checked;document.querySelectorAll('.line .en').forEach(x=>{x.hidden=!S.showEn;});}
  else if(t.dataset.act==='cando'){P.cando[t.dataset.k]=t.checked;save();}
});
let dt;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='draft'){P.drafts[L(S.idx).id]=t.value;clearTimeout(dt);dt=setTimeout(save,400);}
  else if(t.id==='search'){S.words=t.value;document.getElementById('wl').innerHTML=wordsList(S.words);}
});
document.addEventListener('keydown',e=>{
  if(prKey(e))return;
  if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();answerQ();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('fc')){e.preventDefault();if(S.fc&&S.fc.q.length){S.fc.flip=!S.fc.flip;paint();}}
});
ensureAbairWidget();
loadAbairReader().then(()=>syncAbairMode()).catch(()=>{abairLoadFailed=true;});
if(hasTTS){try{speechSynthesis.getVoices();}catch(e){}}
paint();
})();
</script>
</body></html>
